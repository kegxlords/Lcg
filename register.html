<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0F0D">
  <meta name="description" content="LCG - Create Account - Invest Smart. Earn Daily.">
  <title>LCG - Create Account</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/style.css">
  
  <style>
    .auth-card {
      animation: slideUp 0.5s ease;
    }
    
    .password-strength {
      margin-top: var(--spacing-xs);
      font-size: 0.75rem;
    }
    
    .strength-weak { color: var(--danger); }
    .strength-medium { color: var(--warning); }
    .strength-strong { color: var(--success); }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="auth-logo-icon">L</div>
          <span>LCG</span>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join LCG and start earning today</p>
      </div>
      
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="full_name">
            <i class="fa-solid fa-user"></i> Full Name
          </label>
          <input 
            type="text" 
            id="full_name" 
            class="input" 
            placeholder="John Doe" 
            required
            autocomplete="name"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="email">
            <i class="fa-solid fa-envelope"></i> Email Address
          </label>
          <input 
            type="email" 
            id="email" 
            class="input" 
            placeholder="you@example.com" 
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fa-solid fa-lock"></i> Password
          </label>
          <input 
            type="password" 
            id="password" 
            class="input" 
            placeholder="Min. 6 characters" 
            required
            autocomplete="new-password"
            minlength="6"
          >
          <div class="password-strength" id="password-strength"></div>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="referral_code">
            <i class="fa-solid fa-gift"></i> Referral Code <span class="text-muted">(Optional)</span>
          </label>
          <input 
            type="text" 
            id="referral_code" 
            class="input" 
            placeholder="Enter upline's code"
            maxlength="8"
            style="text-transform: uppercase;"
          >
          <small class="text-muted" style="font-size: 0.75rem;">
            Enter your upline's referral code if you have one
          </small>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
          <i class="fa-solid fa-user-plus"></i>
          Create Account
        </button>
      </form>
      
      <div class="auth-footer">
        <p class="text-muted">
          Already have an account? 
          <a href="/index.html" style="color: var(--primary); font-weight: 700;">
            Sign In
          </a>
        </p>
      </div>
    </div>
  </div>
  
  <script type="module">
    import { supabase } from '/assets/js/lcg-client.js';
    
    // Check if already logged in
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = '/app/dashboard.html';
    }
    
    // Auto-fill referral code from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
      document.getElementById('referral_code').value = refCode.toUpperCase();
    }
    
    // Password strength indicator
    const passwordInput = document.getElementById('password');
    const strengthIndicator = document.getElementById('password-strength');
    
    passwordInput.addEventListener('input', (e) => {
      const password = e.target.value;
      let strength = '';
      let className = '';
      
      if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
        strength = 'Strong password';
        className = 'strength-strong';
      } else if (password.length >= 6) {
        strength = 'Medium password';
        className = 'strength-medium';
      } else if (password.length > 0) {
        strength = 'Weak password';
        className = 'strength-weak';
      }
      
      strengthIndicator.textContent = strength;
      strengthIndicator.className = 'password-strength ' + className;
    });
    
    // Handle form submission
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('full_name').value.trim();
      const referralCode = document.getElementById('referral_code').value.trim().toUpperCase();
      const submitBtn = document.getElementById('submit-btn');
      
      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating account...';
      
      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              referral_code: referralCode || null
            }
          }
        });
        
        if (error) throw error;
        
        // Show success message
        submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Account Created!';
        submitBtn.style.background = 'var(--success)';
        
        // Show alert with next steps
        alert('Account created successfully! Please check your email to confirm your account.');
        
        // Redirect to login
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 2000);
        
      } catch (error) {
        console.error('Registration error:', error);
        
        // Reset button
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        
        // Show error
        alert(error.message || 'Failed to create account. Please try again.');
      }
    });
  </script>
</body>
</html>
