<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — My Investments</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
const summary = {
  invested: LCG.user.invested,
  active: 3,
  daily: LCG.investments.filter(i=>i.status==='active').reduce((s,i)=>s+i.daily,0),
  projected: LCG.investments.filter(i=>i.status==='active').reduce((s,i)=>s+i.daily*(i.days-i.day),0),
};
app.innerHTML = `
${topbarHTML('orders')}
<main class="page page-enter">
  <div class="page-head">
    <h1>My investments</h1>
    <p>Track active positions and projected returns.</p>
  </div>

  <div class="hero-balance" style="padding:20px;">
    <div class="label">Total invested</div>
    <div class="amount" style="font-size:32px;"><span class="cur">₦</span>${LCG.user.invested.toLocaleString()}</div>
    <div class="sub-row">
      <div class="sub"><div class="k">Daily yield</div><div class="v" style="color:var(--jade-light);">${naira(summary.daily)}</div></div>
      <div class="sub"><div class="k">Projected</div><div class="v">${nairaShort(summary.projected)}</div></div>
      <div class="sub"><div class="k">Active</div><div class="v">${summary.active}</div></div>
    </div>
  </div>

  <div class="tabs" data-tabs="inv">
    <button class="tab active" data-cat="all">All</button>
    <button class="tab" data-cat="active">Active</button>
    <button class="tab" data-cat="done">Completed</button>
  </div>

  <div data-tab-panel="inv" style="display:flex;flex-direction:column;gap:14px;">
    ${LCG.investments.map((inv,idx) => {
      const pct = Math.round(inv.day/inv.days*100);
      const dataCat = inv.status;
      return `
      <div class="card card-pad lux" data-cat="${dataCat}">
        <div class="flex between center">
          <div class="flex gap-3 center">
            <div class="ic-box jade">${I.plans}</div>
            <div>
              <div style="font-weight:600;font-size:15px;">${inv.plan}</div>
              <div class="small muted">${naira(inv.amount)} invested</div>
            </div>
          </div>
          <span class="badge ${inv.status==='active'?'jade':'muted'}">${inv.status}</span>
        </div>
        <div style="margin-top:16px;">
          <div class="flex between center small">
            <span class="muted">Day ${inv.day} of ${inv.days}</span>
            <span style="color:var(--jade-light);font-weight:600;">${pct}%</span>
          </div>
          <div class="progress" style="margin-top:6px;"><i style="width:${pct}%"></i></div>
        </div>
        <div class="grid-2" style="margin-top:14px;">
          <div class="stat" style="padding:12px;">
            <div class="k">Daily payout</div>
            <div class="v" style="font-size:18px;color:var(--jade-light);">${naira(inv.daily)}</div>
          </div>
          <div class="stat" style="padding:12px;">
            <div class="k">Total projected</div>
            <div class="v" style="font-size:18px;">${naira(inv.daily*inv.days)}</div>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <a href="products.html" class="btn btn-ghost btn-block">${I.plus} Invest in a new plan</a>
</main>
${bottomNavHTML('orders')}
`;
</script>
</body>
</html>
