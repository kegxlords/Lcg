<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCG - My Investments</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--spacing-lg); margin-bottom: var(--spacing-md); }
    .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md); }
    .inv-name { font-family: 'Sora'; font-weight: 700; font-size: 1.1rem; }
    .inv-status { padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; }
    .status-active { background: rgba(0, 224, 138, 0.2); color: var(--success); }
    .status-completed { background: rgba(245, 197, 24, 0.2); color: var(--gold); }
    
    .inv-details { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); margin-bottom: var(--spacing-md); }
    .detail-item span { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .detail-item strong { font-family: 'Sora'; font-size: 0.9rem; }
    
    .progress-container { background: var(--bg); height: 8px; border-radius: 4px; overflow: hidden; margin-top: var(--spacing-sm); }
    .progress-bar { background: linear-gradient(90deg, var(--primary), var(--primary-dark)); height: 100%; transition: width 0.5s ease; }
  </style>
</head>
<body>
  <div class="page-content" style="padding: var(--spacing-md);">
    <h2 style="margin-bottom: var(--spacing-lg);">My Investments</h2>

    <div id="payout-toast" style="display:none; background: var(--primary-dim); border: 1px solid var(--primary); color: var(--primary); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); text-align: center; font-weight: 600;">
      <i class="fa-solid fa-coins"></i> <span id="payout-amount">₦0</span> auto-credited to your wallet!
    </div>

    <div id="investments-container" class="fade-in">
      <div style="text-align: center; padding: var(--spacing-xl); color: var(--text-muted);">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/assets/js/auth-guard.js';
    import { loadShell, updateBalance } from '/assets/js/components.js';
    import { supabase, formatCurrency } from '/assets/js/lcg-client.js';

    const user = await requireAuth();
    if (!user) return;
    await loadShell();

    async function loadInvestments() {
      // 1. Trigger Auto-Payout
      const payoutRes = await fetch('/api/investments?action=autoPayout', {
        headers: { 'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}` }
      });
      const payoutData = await payoutRes.json();
      
      if (payoutData.credited > 0) {
        document.getElementById('payout-amount').textContent = formatCurrency(payoutData.credited);
        document.getElementById('payout-toast').style.display = 'block';
        updateBalance(payoutData.new_balance);
        setTimeout(() => document.getElementById('payout-toast').style.display = 'none', 5000);
      }

      // 2. Fetch Investments
      const res = await fetch('/api/investments?action=getInvestments', {
        headers: { 'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}` }
      });
      const data = await res.json();
      renderInvestments(data.investments || []);
    }

    function renderInvestments(investments) {
      const container = document.getElementById('investments-container');

      if (investments.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: var(--spacing-xl); color: var(--text-muted);">No investments yet. <a href="/app/products.html" style="color: var(--primary);">Start investing</a></div>';
        return;
      }

      container.innerHTML = investments.map(inv => {
        const isCompleted = inv.status === 'completed';
        const startDate = new Date(inv.start_date).getTime();
        const endDate = new Date(inv.end_date).getTime();
        const now = Date.now();
        const totalDuration = endDate - startDate;
        const elapsed = now - startDate;
        const progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));

        return `
          <div class="inv-card">
            <div class="inv-header">
              <div class="inv-name">${inv.products?.name || 'Unknown Plan'}</div>
              <div class="inv-status ${isCompleted ? 'status-completed' : 'status-active'}">${isCompleted ? 'Completed' : 'Active'}</div>
            </div>
            
            <div class="inv-details">
              <div class="detail-item"><span>Invested</span><strong>${formatCurrency(inv.amount)}</strong></div>
              <div class="detail-item"><span>Expected Profit</span><strong>${formatCurrency(inv.expected_profit)}</strong></div>
              <div class="detail-item"><span>Start Date</span><strong>${new Date(inv.start_date).toLocaleDateString()}</strong></div>
              <div class="detail-item"><span>End Date</span><strong>${new Date(inv.end_date).toLocaleDateString()}</strong></div>
            </div>

            ${!isCompleted ? `
              <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Progress: ${Math.round(progressPercent)}%</div>
              <div class="progress-container"><div class="progress-bar" style="width: ${progressPercent}%"></div></div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    loadInvestments();
  </script>
</body>
</html>
