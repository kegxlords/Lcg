<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Wallet</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
app.innerHTML = `
${topbarHTML('me')}
<main class="page page-enter">
  <div class="page-head">
    <h1>Wallet</h1>
    <p>Balance, earnings, and full transaction history.</p>
  </div>

  <div class="hero-balance">
    <div class="label">Total balance</div>
    <div class="amount"><span class="cur">₦</span>17,600<span style="font-size:18px;color:var(--fg-muted);font-family:var(--f-body);font-weight:500;">.00</span></div>
    <div class="sub-row">
      <div class="sub"><div class="k">Available</div><div class="v">${naira(LCG.user.available)}</div></div>
      <div class="sub"><div class="k">Earnings</div><div class="v" style="color:var(--jade-light);">${naira(LCG.user.earnings)}</div></div>
    </div>
  </div>

  <div class="grid-2">
    <a href="deposit.html" class="btn btn-jade">${I.deposit} Deposit</a>
    <a href="withdraw.html" class="btn btn-gold">${I.withdraw} Withdraw</a>
  </div>

  <div class="stat-row">
    <div class="stat lux">
      <div class="k">${I.arrowDown} Total deposited</div>
      <div class="v">${nairaShort(120000)}</div>
      <div class="delta up">▲ Lifetime</div>
    </div>
    <div class="stat lux">
      <div class="k">${I.arrowUp} Total withdrawn</div>
      <div class="v">${nairaShort(93000)}</div>
      <div class="delta muted">All time</div>
    </div>
  </div>

  <div class="tabs" data-tabs="tx">
    <button class="tab active" data-cat="all">All</button>
    <button class="tab" data-cat="in">Income</button>
    <button class="tab" data-cat="out">Outgoing</button>
  </div>

  <div class="card card-pad">
    <div class="list">
      ${LCG.transactions.map(t => `
        <div class="row" data-cat="${t.dir}">
          <div class="ic-box ${t.tone}">${I[t.ic]||I.coin}</div>
          <div class="body">
            <div class="t">${t.type}</div>
            <div class="s">${t.sub}</div>
          </div>
          <div class="end">
            <div class="amt ${t.dir==='in'?'up':'down'}">${t.dir==='in'?'+':'−'}${naira(t.amt)}</div>
            <div class="ts">${t.ts}</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>

  <button class="btn btn-ghost btn-block" onclick="toast('Showing latest 6 transactions','info');">${I.refresh} Load more</button>
</main>
${bottomNavHTML('me')}
`;

// patch tabs for tx filter (data-cat on row)
setTimeout(()=>{
  const tabs = document.querySelectorAll('[data-tabs="tx"] .tab');
  const panel = document.querySelector('[data-tab-panel="tx"]') || document.querySelector('.list').closest('.card');
  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');
    const cat = t.dataset.cat;
    document.querySelectorAll('.list .row').forEach(r=>{
      r.style.display = (cat==='all'||r.dataset.cat===cat)?'flex':'none';
    });
  }));
},50);
</script>
</body>
</html>
