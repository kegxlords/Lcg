<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Support</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
app.innerHTML = `
${topbarHTML('me')}
<main class="page page-enter">
  <div class="page-head">
    <h1>Support</h1>
    <p>We're here 24/7. Choose how you'd like to reach us.</p>
  </div>

  <!-- contact channels -->
  <div class="grid-2">
    <div class="card card-pad lux" style="text-align:center;cursor:pointer;" onclick="toast('Opening live chat…','info');">
      <div class="ic-box jade" style="width:48px;height:48px;margin:0 auto 10px;border-radius:14px;">${I.service}</div>
      <div style="font-weight:600;font-size:14px;">Live chat</div>
      <div class="small muted" style="margin-top:2px;">Avg. reply &lt; 2 min</div>
      <span class="badge jade" style="margin-top:8px;">● ONLINE</span>
    </div>
    <div class="card card-pad lux" style="text-align:center;cursor:pointer;" onclick="toast('Opening ticket form…','info');">
      <div class="ic-box gold" style="width:48px;height:48px;margin:0 auto 10px;border-radius:14px;">${I.ticket}</div>
      <div style="font-weight:600;font-size:14px;">Submit ticket</div>
      <div class="small muted" style="margin-top:2px;">Reply within 4h</div>
    </div>
  </div>

  <!-- contact methods -->
  <div class="card card-pad">
    <div class="list">
      <a href="#" class="row" onclick="toast('Email copied','ok');copyText('help@lcg.io');return false;">
        <div class="ic-box">${I.mail}</div>
        <div class="body"><div class="t">Email</div><div class="s">help@lcg.io</div></div>
        <div class="end"><span class="badge muted">COPY</span></div>
      </a>
      <a href="#" class="row" onclick="toast('Phone copied','ok');copyText('+234700LCGHELP');return false;">
        <div class="ic-box">${I.phone}</div>
        <div class="body"><div class="t">Hotline</div><div class="s">+234 700 LCG HELP</div></div>
        <div class="end"><span class="badge muted">COPY</span></div>
      </a>
      <a href="#" class="row" onclick="toast('WhatsApp opening…','info');return false;">
        <div class="ic-box jade"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.3 0-.5l-.9-2.1c-.2-.5-.4-.5-.6-.5h-.6c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.2s.9 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.2-.3-.2-.5-.3z"/><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.3A10 10 0 1 0 12 2z"/></svg></div>
        <div class="body"><div class="t">WhatsApp</div><div class="s">+234 803 ••• 0001</div></div>
        <div class="end"><span class="badge jade">● ONLINE</span></div>
      </a>
    </div>
  </div>

  <!-- FAQ -->
  <div class="section-head"><h2>Frequently asked</h2></div>
  <div style="display:flex;flex-direction:column;gap:10px;">
    ${LCG.faqs.map(f => `
      <div class="faq">
        <div class="q">
          <span>${f.q}</span>
          <span class="ic">${I.chevronDown}</span>
        </div>
        <div class="a">${f.a}</div>
      </div>
    `).join('')}
  </div>

  <!-- risk notice -->
  <div class="card card-pad" style="background:rgba(244,63,94,0.05);border-color:rgba(244,63,94,0.18);">
    <div class="flex gap-3" style="align-items:flex-start;">
      <div class="ic-box rose" style="width:36px;height:36px;flex-shrink:0;">${I.shield}</div>
      <div>
        <div style="font-weight:600;font-size:14px;color:#fb7185;">Security reminder</div>
        <div class="small muted" style="margin-top:4px;line-height:1.6;">LCG staff will never ask for your password, OTP, or full card number. Report any suspicious contact via the official channels above. Always verify the URL is <b style="color:var(--fg);">lcg.io</b>.</div>
      </div>
    </div>
  </div>

  <div class="foot-mini">
    Response times apply to business hours (WAT 8am–10pm).<br>
    Off-hours emergencies: use WhatsApp.<br>
    © 2026 LCG · v2.4.0
  </div>
</main>
${bottomNavHTML('me')}
`;
</script>
</body>
</html>
