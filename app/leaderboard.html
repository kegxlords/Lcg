<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Leaderboard</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
app.innerHTML = `
${topbarHTML('home')}
<main class="page page-enter">
  <div class="page-head">
    <h1>Leaderboard</h1>
    <p>Top earners this month. Payouts reset every 30 days.</p>
  </div>

  <div class="tabs" data-tabs="lb">
    <button class="tab active" data-cat="all">All time</button>
    <button class="tab" data-cat="month">This month</button>
    <button class="tab" data-cat="week">This week</button>
  </div>

  <!-- podium top 3 -->
  <div class="card card-pad-lg" style="background:linear-gradient(160deg,rgba(231,200,115,0.1),rgba(16,185,129,0.05));text-align:center;">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-light);font-weight:600;">${I.trophy} Top 3 this month</div>
    <div style="display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-top:18px;">
      <div style="text-align:center;flex:1;">
        <div class="avatar silver" style="width:52px;height:52px;font-size:18px;margin:0 auto;">${LCG.leaderboard[1].avatar}</div>
        <div style="font-weight:600;font-size:13px;margin-top:8px;">${LCG.leaderboard[1].name.split(' ')[0]}</div>
        <div class="small muted tnum">${nairaShort(LCG.leaderboard[1].amt)}</div>
        <div style="font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--fg-muted);margin-top:4px;">2</div>
      </div>
      <div style="text-align:center;flex:1.2;">
        <div style="font-size:22px;margin-bottom:-4px;">👑</div>
        <div class="avatar gold" style="width:64px;height:64px;font-size:22px;margin:0 auto;box-shadow:0 0 0 4px rgba(231,200,115,0.3),0 16px 30px -8px rgba(231,200,115,0.5);">${LCG.leaderboard[0].avatar}</div>
        <div style="font-weight:700;font-size:14px;margin-top:8px;">${LCG.leaderboard[0].name.split(' ')[0]}</div>
        <div class="small muted tnum">${nairaShort(LCG.leaderboard[0].amt)}</div>
        <div style="font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--gold-light);margin-top:4px;">1</div>
      </div>
      <div style="text-align:center;flex:1;">
        <div class="avatar" style="width:52px;height:52px;font-size:18px;margin:0 auto;background:linear-gradient(135deg,#d8a571,#a16207);color:#1c1206;">${LCG.leaderboard[2].avatar}</div>
        <div style="font-weight:600;font-size:13px;margin-top:8px;">${LCG.leaderboard[2].name.split(' ')[0]}</div>
        <div class="small muted tnum">${nairaShort(LCG.leaderboard[2].amt)}</div>
        <div style="font-family:var(--f-display);font-size:20px;font-weight:700;color:#d8a571;margin-top:4px;">3</div>
      </div>
    </div>
  </div>

  <!-- your rank -->
  <div class="card card-pad" style="border-color:rgba(52,211,153,0.3);background:rgba(16,185,129,0.06);">
    <div class="flex between center">
      <div class="flex gap-3 center">
        <div class="lb-rank" style="background:rgba(16,185,129,0.18);color:var(--jade-light);">4</div>
        <div>
          <div style="font-weight:600;font-size:14px;">You · Adaeze O.</div>
          <div class="small muted">VIP Gold · ${LCG.user.uid}</div>
        </div>
      </div>
      <div class="end">
        <div class="amt up">${naira(LCG.user.totalEarned)}</div>
        <div class="ts">Your earnings</div>
      </div>
    </div>
  </div>

  <!-- full ranking -->
  <div class="section-head"><h2>Full ranking</h2></div>
  <div style="display:flex;flex-direction:column;gap:8px;">
    ${LCG.leaderboard.slice(3).map((m,i) => `
      <div class="lb-row">
        <div class="lb-rank ${i===0?'r3':''}">${i+4}</div>
        <div class="flex center gap-3" style="min-width:0;">
          <div class="avatar ${m.tone}" style="width:36px;height:36px;font-size:13px;">${m.avatar}</div>
          <div style="min-width:0;">
            <div style="font-weight:600;font-size:14px;">${m.name} ${m.me?'<span class="badge jade" style="font-size:9px;padding:2px 6px;">YOU</span>':''}</div>
            <div class="small muted">${m.uid} · ${m.vip}</div>
          </div>
        </div>
        <div class="end">
          <div class="amt tnum">${naira(m.amt)}</div>
        </div>
      </div>
    `).join('')}
  </div>

  <div class="card card-pad lux" style="background:linear-gradient(160deg,rgba(231,200,115,0.08),rgba(255,255,255,0.02));">
    <div class="flex gap-3 center">
      <div class="ic-box gold" style="width:42px;height:42px;">${I.fire}</div>
      <div>
        <div style="font-weight:600;font-size:14px;">Climb to rank #3</div>
        <div class="small muted" style="margin-top:2px;">Earn ${naira(980000 - LCG.user.totalEarned)} more to overtake Tunde O.</div>
      </div>
    </div>
  </div>
</main>
${bottomNavHTML('home')}
`;
</script>
</body>
</html>
