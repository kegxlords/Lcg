<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCG - Deposit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="page-content" style="padding: var(--spacing-md);">
    <h2 style="margin-bottom: var(--spacing-lg);">Make a Deposit</h2>

    <div class="card fade-in">
      <h3 style="margin-bottom: var(--spacing-md); color: var(--primary);"><i class="fa-solid fa-building-columns"></i> Company Bank Details</h3>
      <div id="bank-details" style="margin-bottom: var(--spacing-lg);">
        <div style="text-align: center; color: var(--text-muted);"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
      </div>
    </div>

    <form id="deposit-form" class="card fade-in">
      <div class="form-group">
        <label class="form-label">Amount (₦)</label>
        <input type="number" id="amount" class="input" placeholder="Min. 1000" required min="1000">
      </div>
      <div class="form-group">
        <label class="form-label">Sender Name (as on bank app)</label>
        <input type="text" id="sender_name" class="input" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label class="form-label">Payment Method</label>
        <select id="payment_method" class="input">
          <option value="bank_transfer">Bank Transfer</option>
          <option value="opay">Opay</option>
          <option value="palmpay">PalmPay</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Transaction Reference (Optional)</label>
        <input type="text" id="proof_ref" class="input" placeholder="e.g. TRF123456789">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
        <i class="fa-solid fa-paper-plane"></i> Submit Deposit
      </button>
    </form>
  </div>

  <script type="module">
    import { requireAuth } from '/assets/js/auth-guard.js';
    import { loadShell } from '/assets/js/components.js';
    import { supabase } from '/assets/js/lcg-client.js';

    const user = await requireAuth();
    if (user) {
      await loadShell();

    // Load bank details
    const { data: settings } = await supabase.from('site_settings').select('key, value');
    const bankDetails = {};
    settings?.forEach(s => bankDetails[s.key] = s.value);
    
    document.getElementById('bank-details').innerHTML = `
      <div style="background: var(--bg); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-sm);">
        <div style="font-size: 0.8rem; color: var(--text-muted);">Bank Name</div>
        <div style="font-weight: 700;">${bankDetails['deposit_bank_name'] || 'Not set'}</div>
      </div>
      <div style="background: var(--bg); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-sm);">
        <div style="font-size: 0.8rem; color: var(--text-muted);">Account Number</div>
        <div style="font-weight: 700; font-family: 'Sora';">${bankDetails['deposit_account_number'] || 'Not set'}</div>
      </div>
      <div style="background: var(--bg); padding: var(--spacing-md); border-radius: var(--radius-md);">
        <div style="font-size: 0.8rem; color: var(--text-muted);">Account Name</div>
        <div style="font-weight: 700;">${bankDetails['deposit_account_name'] || 'Not set'}</div>
      </div>
    `;

    // Handle submit
    document.getElementById('deposit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting...';

      const res = await fetch('/api/wallet?action=submitDeposit', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}` 
        },
        body: JSON.stringify({
          amount: document.getElementById('amount').value,
          sender_name: document.getElementById('sender_name').value,
          payment_method: document.getElementById('payment_method').value,
          proof_ref: document.getElementById('proof_ref').value
        })
      });

      const data = await res.json();
      if (!res.ok) {
        alert(data.error);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Deposit';
      } else {
        alert('Deposit submitted successfully! Please wait for admin approval.');
        window.location.href = '/app/wallet.html';
      }
      });
    }
  </script>
</body>
</html>
