<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Deposit</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
let selMethod = 'card';
let selAmt = 0;
const methods = [
  { id: 'card', name: 'Debit / Credit card', sub: 'Visa, Mastercard, Verve · Instant', tone: 'jade', sym: '💳' },
  { id: 'bank', name: 'Bank transfer', sub: 'GTBank, Access, Zenith · 5 min', tone: 'gold', sym: '🏦' },
  { id: 'ussd', name: 'USSD', sub: '*737# · Quick code', tone: 'violet', sym: '📲' },
  { id: 'crypto', name: 'USDT (crypto)', sub: 'TRC20 · ~3 min', tone: 'rose', sym: '◈' },
];
const chips = [1000, 5000, 10000, 25000, 50000, 100000, 250000, 500000];
app.innerHTML = `
${topbarHTML('me')}
<main class="page page-enter">
  <div class="page-head">
    <h1>Deposit</h1>
    <p>Funds are credited instantly and earn from day one.</p>
  </div>

  <div class="amt-display card">
    <div class="lbl">Deposit amount</div>
    <div class="val" id="amtVal"><span style="opacity:0.5;">₦</span>0</div>
    <div class="small muted">Min ₦1,000 · No maximum</div>
  </div>

  <div class="amt-chips" id="chips">
    ${chips.map((c,i)=>`<button class="amt-chip" data-amt="${c}" onclick="pickAmt(${c},this)">${c>=1000?(c/1000)+'K':'₦'+c}</button>`).join('')}
  </div>

  <div class="field">
    <label for="custom">Or enter custom amount</label>
    <div class="input-wrap">
      <span class="lead" style="color:var(--jade-light);font-weight:600;left:16px;">₦</span>
      <input class="input has-lead" id="custom" type="number" placeholder="0" min="1000" oninput="syncCustom(this)">
    </div>
  </div>

  <div class="section-head" style="margin-top:8px;"><h2>Payment method</h2></div>
  <div style="display:flex;flex-direction:column;gap:10px;" id="methods">
    ${methods.map(m=>`
      <button class="method ${m.id==='card'?'on':''}" data-mid="${m.id}" onclick="pickMethod('${m.id}',this)">
        <div class="ic-box ${m.tone}" style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,0.04);">${m.sym}</div>
        <div class="body">
          <div class="t">${m.name}</div>
          <div class="s">${m.sub}</div>
        </div>
        <div class="check on" style="${m.id==='card'?'':'opacity:0;'}" data-check="${m.id}"></div>
      </button>
    `).join('')}
  </div>

  <div class="card card-pad" style="background:rgba(16,185,129,0.05);border-color:rgba(52,211,153,0.18);">
    <div class="flex gap-3 center">
      <div class="ic-box jade" style="width:36px;height:36px;">${I.shield}</div>
      <div class="small" style="color:var(--fg-soft);">Deposits above ₦50,000 unlock <b style="color:var(--jade-light);">priority withdrawals</b> and a bonus 0.5% on first payout.</div>
    </div>
  </div>

  <button class="btn btn-jade btn-block" onclick="confirmDeposit()">${I.deposit} Confirm deposit</button>
</main>
${bottomNavHTML('me')}
`;

function pickAmt(v, el){
  selAmt = v;
  document.querySelectorAll('.amt-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('custom').value = v;
  document.getElementById('amtVal').innerHTML = '<span style="opacity:0.5;">₦</span>'+v.toLocaleString();
}
function syncCustom(input){
  selAmt = parseInt(input.value)||0;
  document.querySelectorAll('.amt-chip').forEach(c=>c.classList.remove('on'));
  document.getElementById('amtVal').innerHTML = '<span style="opacity:0.5;">₦</span>'+selAmt.toLocaleString();
}
function pickMethod(id, el){
  selMethod = id;
  document.querySelectorAll('#methods .method').forEach(m=>m.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('[data-check]').forEach(c=>c.style.opacity='0');
  document.querySelector('[data-check="'+id+'"]').style.opacity='1';
}
function confirmDeposit(){
  if(selAmt < 1000){ toast('Minimum deposit is ₦1,000','err'); return; }
  toast('Depositing ' + naira(selAmt) + ' via ' + methods.find(m=>m.id===selMethod).name + '…','info');
  setTimeout(()=>toast('Deposit successful! Balance updated.','ok'), 1400);
}
</script>
</body>
</html>
