<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060907">
<title>LCG — Deposit</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.deposit-page { max-width:680px; margin-inline:auto; }
.deposit-note { display:flex; align-items:flex-start; gap:12px; line-height:1.55; }
.deposit-note .ic-box { flex:0 0 38px; width:38px; height:38px; }
.deposit-page .field + .field { margin-top:16px; }
.deposit-page .btn-block { margin-top:18px; }
.deposit-page .small { line-height:1.6; }
@media(max-width:520px) {
 .deposit-page { padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
 .deposit-page .amt-display { padding:20px 12px; }
 .deposit-page .amt-display .val { font-size:clamp(30px,9vw,38px); overflow-wrap:anywhere; }
 .deposit-page .amt-chips { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
</style>
</head>
<body>
<div class="app" id="app" data-live-ready="false" aria-live="polite"></div>
<script src="../assets/js/app.js"></script>
<script type="module">
import { apiRequest, money, escapeHTML, showPageError, showLoading } from '../assets/js/live-data.js';

const app = document.getElementById('app');
const UI = window.LCGUI;
const safeNumber = value => { const n = Number(value); return Number.isFinite(n) ? n : null; };
const presets = [1000, 5000, 10000, 25000];

function shell(balance, content) {
  app.innerHTML = `${UI.topbarHTML('me', balance)}<main class="page page-enter deposit-page">
    <div class="page-head"><h1>Deposit</h1><p>Choose manual bank transfer for review or AfrStar secure checkout.</p></div>${content}
  </main>${UI.bottomNavHTML('me')}`;
}

function render(balance, afrstarEnabled) {
  shell(balance, `<div class="amt-display card card-pad">
      <div class="lbl">Deposit amount</div>
      <div class="val" id="amount-display">${escapeHTML(money(0))}</div>
      <div class="small muted">Enter the amount you want to deposit.</div>
    </div>
    <div class="amt-chips" aria-label="Suggested amounts">${presets.map(value => `<button class="amt-chip" type="button" data-preset="${value}">${value >= 1000 ? `${value / 1000}K` : escapeHTML(money(value))}</button>`).join('')}</div>
    <div class="field" style="margin-top:18px"><label for="deposit-amount">Deposit amount</label><div class="input-wrap"><span class="lead" aria-hidden="true" style="color:var(--jade-light);font-weight:600">₦</span><input class="input has-lead" id="deposit-amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" autocomplete="off" required></div></div>
    <div class="field"><label for="payment-method">Payment method</label><select class="input" id="payment-method">${afrstarEnabled ? '<option value="afrstar" selected>AfrStar secure checkout</option><option value="bank_transfer">Manual bank transfer</option>' : '<option value="bank_transfer" selected>Manual bank transfer</option>'}</select></div>
    <div class="field"><label for="sender-name">Payer name</label><input class="input" id="sender-name" type="text" maxlength="120" autocomplete="name" placeholder="Name used for payment" required></div>
    <div class="field" id="phone-field" hidden><label for="payer-phone">Phone number</label><input class="input" id="payer-phone" type="tel" maxlength="40" autocomplete="tel" placeholder="Phone number for AfrStar checkout"></div>
    <div class="field" id="proof-field"><label for="proof-ref">Bank transfer reference</label><input class="input" id="proof-ref" type="text" maxlength="160" autocomplete="off" placeholder="Enter your transfer reference"></div>
    <div class="card card-pad" style="margin-top:18px"><div class="deposit-note"><div class="ic-box jade" aria-hidden="true">${UI.icons.info}</div><div class="small" id="deposit-note" style="color:var(--fg-soft)"><strong>Review required</strong><br>Your manual transfer request stays pending until reviewed; no funds are credited when submitted.</div></div></div>
    <div id="deposit-result" aria-live="polite"></div>
    <button class="btn btn-jade btn-block" id="submit-deposit" type="button">${UI.icons.deposit} Submit deposit request</button>`);

  const amountInput = document.getElementById('deposit-amount');
  const amountDisplay = document.getElementById('amount-display');
  const result = document.getElementById('deposit-result');
  const submit = document.getElementById('submit-deposit');
  const paymentMethod = document.getElementById('payment-method');
  const phoneField = document.getElementById('phone-field');
  const proofField = document.getElementById('proof-field');
  const note = document.getElementById('deposit-note');

  function updateMethod() {
    const useAfrStar = paymentMethod.value === 'afrstar';
    phoneField.hidden = !useAfrStar;
    proofField.hidden = useAfrStar;
    note.innerHTML = useAfrStar
      ? '<strong>Secure checkout</strong><br>You will be redirected to AfrStar. Your wallet is credited only after a verified payment callback.'
      : '<strong>Review required</strong><br>Your manual transfer request stays pending until reviewed; no funds are credited when submitted.';
    submit.innerHTML = useAfrStar ? `${UI.icons.deposit} Continue to AfrStar` : `${UI.icons.deposit} Submit deposit request`;
  }
  paymentMethod.addEventListener('change', updateMethod);
  updateMethod();

  amountInput.addEventListener('input', () => {
    const amount = safeNumber(amountInput.value);
    amountDisplay.textContent = money(amount !== null && amount > 0 ? amount : 0);
    app.querySelectorAll('[data-preset]').forEach(button => button.classList.toggle('on', Number(button.dataset.preset) === amount));
  });
  app.querySelectorAll('[data-preset]').forEach(button => button.addEventListener('click', () => {
    amountInput.value = button.dataset.preset;
    amountInput.dispatchEvent(new Event('input', { bubbles: true }));
  }));

  submit.addEventListener('click', async () => {
    const amount = safeNumber(amountInput.value);
    const senderName = document.getElementById('sender-name').value.trim();
    const useAfrStar = paymentMethod.value === 'afrstar';
    const proofRef = document.getElementById('proof-ref').value.trim();
    const phone = document.getElementById('payer-phone').value.trim();
    if (amount === null || amount <= 0 || !senderName || (!useAfrStar && !proofRef) || (useAfrStar && !phone)) {
      UI.toast(useAfrStar ? 'Enter a valid amount, payer name and phone number.' : 'Enter a valid amount, payer name and bank-transfer reference.','err');
      return;
    }

    submit.disabled = true;
    submit.textContent = useAfrStar ? 'Creating secure checkout…' : 'Submitting request…';
    result.innerHTML = '';
    try {
      const response = await apiRequest('/api/wallet?action=submitDeposit', {
        method: 'POST',
        body: useAfrStar
          ? { amount, sender_name: senderName, phone, payment_method: 'afrstar' }
          : { amount, sender_name: senderName, payment_method: 'bank_transfer', proof_ref: proofRef }
      });
      if (useAfrStar) {
        const checkout = new URL(response?.pay_url || '');
        if (checkout.protocol !== 'https:') throw new Error('AfrStar returned an invalid checkout URL.');
        result.innerHTML = '<div class="card card-pad" style="margin-top:14px" role="status"><strong>Opening AfrStar secure checkout…</strong><p class="small muted">Do not refresh or submit a second payment while checkout opens.</p></div>';
        window.location.assign(checkout.toString());
        return;
      }
      const requestId = response?.deposit?.id ?? response?.id ?? response?.request_id ?? response?.reference;
      result.innerHTML = `<div class="card card-pad" style="margin-top:14px" role="status"><strong>Deposit request submitted for review</strong><p class="small muted" style="margin:6px 0 0">Your request is pending review; no funds have been credited yet.${requestId ? `<br>Reference: ${escapeHTML(requestId)}` : ''}</p></div>`;
      UI.toast('Deposit request submitted for review.','ok');
      amountInput.value = '';
      amountInput.dispatchEvent(new Event('input', { bubbles: true }));
      document.getElementById('sender-name').value = '';
      document.getElementById('proof-ref').value = '';
    } catch (error) {
      result.innerHTML = `<div class="data-state data-state-error" role="alert"><p>${escapeHTML(error?.message || 'Could not submit the request.')}</p></div>`;
      UI.toast(error?.message || 'Could not submit deposit request.','err');
    } finally {
      submit.disabled = false;
      updateMethod();
    }
  });
  app.dataset.liveReady = 'true';
  return { result };
}

async function load() {
  app.dataset.liveReady = 'false';
  showLoading(app, 'Loading your account…');
  try {
    const response = await apiRequest('/api/wallet?action=getBalance');
    const balance = safeNumber(response?.balance);
    if (balance === null) throw new Error('The wallet service returned an invalid balance.');
    let afrstarEnabled = false;
    try {
      const paymentConfig = await apiRequest('/api/wallet?action=getPaymentConfig');
      afrstarEnabled = paymentConfig?.afrstar_enabled === true;
    } catch (_) {
      // Keep manual deposits available if the gateway configuration endpoint is unavailable.
    }
    const rendered = render(balance, afrstarEnabled);
    if (new URLSearchParams(window.location.search).get('payment') === 'return') {
      rendered.result.innerHTML = '<div class="card card-pad" style="margin-top:14px" role="status"><strong>Payment confirmation pending</strong><p class="small muted">Your wallet updates only after AfrStar sends a verified callback. Check your wallet history shortly.</p></div>';
    }
  } catch (error) {
    showPageError(app, error, load);
    app.dataset.liveReady = 'true';
  }
}

load();
</script>
</body>
</html>
