<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — My Team</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
const teamBonus = LCG.team.reduce((s,m)=>s+m.earned,0);
app.innerHTML = `
${topbarHTML('team')}
<main class="page page-enter">
  <div class="page-head">
    <h1>My team</h1>
    <p>Invite, track referrals, and grow your network.</p>
  </div>

  <!-- referral card -->
  <div class="hero-balance" style="background:radial-gradient(120% 80% at 0% 0%,rgba(231,200,115,0.15),transparent 55%),radial-gradient(120% 80% at 100% 100%,rgba(16,185,129,0.12),transparent 55%),linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));">
    <div class="label" style="color:var(--gold-light);">${I.gift} Your referral code</div>
    <div class="flex between center" style="margin-top:8px;">
      <div style="font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:0.04em;">${LCG.user.referralCode}</div>
      <button class="btn btn-ghost btn-sm" onclick="copyText('${LCG.user.referralCode}','Code')">${I.copy} Copy</button>
    </div>
    <div class="sub-row">
      <div class="sub"><div class="k">Team size</div><div class="v">${LCG.user.teamSize}</div></div>
      <div class="sub"><div class="k">Active</div><div class="v" style="color:var(--jade-light);">${LCG.team.filter(m=>m.active).length}</div></div>
      <div class="sub"><div class="k">Total bonus</div><div class="v">${naira(teamBonus)}</div></div>
    </div>
  </div>

  <!-- bonus structure -->
  <div class="card card-pad">
    <div style="font-weight:600;font-size:14px;margin-bottom:12px;">Bonus structure</div>
    <div class="grid-2">
      <div class="stat" style="padding:14px;">
        <div class="k">Level 1 (direct)</div>
        <div class="v text-jade-grad" style="font-size:22px;">10%</div>
        <div class="small muted">of referral deposits</div>
      </div>
      <div class="stat" style="padding:14px;">
        <div class="k">Level 2 (indirect)</div>
        <div class="v text-gold-grad" style="font-size:22px;">3%</div>
        <div class="small muted">of sub-referrals</div>
      </div>
    </div>
  </div>

  <!-- share actions -->
  <div class="grid-2">
    <button class="btn btn-jade" onclick="toast('Share link copied','ok');copyText('https://lcg.io/r/${LCG.user.referralCode}','Invite link')">${I.share} Share link</button>
    <button class="btn btn-ghost" onclick="toast('QR code ready','info');">${I.qr} Show QR</button>
  </div>

  <!-- members -->
  <div class="section-head"><h2>Team members</h2><span class="small muted">${LCG.team.length} of ${LCG.user.teamSize}</span></div>
  <div class="card card-pad">
    <div class="list">
      ${LCG.team.map(m => `
        <div class="row">
          <div class="avatar ${m.tone}" style="width:38px;height:38px;font-size:14px;">${m.avatar}</div>
          <div class="body">
            <div class="t">${m.name} ${m.active?'<span class="dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--jade-light);box-shadow:0 0 6px var(--jade-light);margin-left:4px;vertical-align:middle;"></span>':''}</div>
            <div class="s">${m.uid} · ${m.tier} · joined ${m.joined}</div>
          </div>
          <div class="end">
            <div class="amt up">+${naira(m.earned)}</div>
            <div class="ts">${m.active?'Active':'Inactive'}</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>

  <div class="card card-pad lux" style="background:linear-gradient(160deg,rgba(231,200,115,0.08),rgba(255,255,255,0.02));border-color:rgba(231,200,115,0.18);">
    <div class="flex gap-3 center">
      <div class="ic-box gold" style="width:42px;height:42px;">${I.fire}</div>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">Reach Gold +5 members</div>
        <div class="small muted" style="margin-top:2px;">Unlock Platinum tier with 0.6% withdrawal fee.</div>
        <div class="progress gold" style="margin-top:10px;"><i style="width:${Math.round(LCG.user.teamSize/80*100)}%;"></i></div>
      </div>
    </div>
  </div>
</main>
${bottomNavHTML('team')}
`;
</script>
</body>
</html>
