<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060907">
<title>LCG — Dashboard</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:16px;align-items:start}.dashboard-stack{display:flex;flex-direction:column;gap:16px}.dashboard-section{min-width:0}.dashboard-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.dashboard-product{min-width:0}.dashboard-product .name{overflow-wrap:anywhere}.dashboard-intro{margin-bottom:18px}.dashboard-balance{margin:0}.live-list .row{gap:12px}.live-list .body{min-width:0}.live-list .t,.live-list .s{overflow-wrap:anywhere}.dashboard-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.welcome-support{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px;padding:18px;background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(231,200,115,.08));border:1px solid rgba(52,211,153,.24);border-radius:var(--r-xl)}.welcome-support-copy{min-width:0}.welcome-support h2{font:600 18px var(--f-display);margin:3px 0 5px}.welcome-support p{color:var(--fg-soft);font-size:13px;line-height:1.5;margin:0}.support-links{display:flex;flex-wrap:wrap;gap:9px;flex-shrink:0}.support-links .btn{white-space:nowrap}@media(max-width:760px){.dashboard-grid{grid-template-columns:1fr;gap:14px}.dashboard-section{width:100%}.dashboard-products{grid-template-columns:1fr}.dashboard-intro{margin-bottom:14px}.welcome-support{align-items:stretch;flex-direction:column;gap:14px}.support-links{display:grid;grid-template-columns:1fr 1fr}.support-links .btn{justify-content:center}}@media(max-width:380px){.live-list .row{align-items:flex-start}.dashboard-actions{grid-template-columns:1fr 1fr}.support-links{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app" data-live-ready="false" aria-busy="true"></div>
<script src="../assets/js/app.js"></script>
<script type="module">
import { apiRequest, getProfile, money, escapeHTML, formatDate, showPageError, showLoading, showEmpty } from '../assets/js/live-data.js';
const app = document.getElementById('app');
const ui = window.LCGUI;

function transactionRows(transactions) {
  if (!transactions.length) return showEmpty('Your wallet activity will appear here when you have transactions.');
  return `<div class="list live-list">${transactions.slice(0,5).map((tx) => {
    const type = escapeHTML(tx.type || tx.description || tx.transaction_type || 'Transaction');
    const date = escapeHTML(formatDate(tx.created_at || tx.date || tx.updated_at));
    const status = tx.status ? `<span class="badge muted">${escapeHTML(tx.status)}</span>` : '';
    const rawAmount = Number(tx.amount || 0);
    const flow = String(tx.type || tx.transaction_type || '').toLowerCase();
    const incoming = /deposit|credit|received|earning|refund|return|commission|wheel_win|bonus|payout/.test(flow);
    const outgoing = !incoming && /withdraw|debit|purchase|investment|payment/.test(flow);
    const sign = incoming ? '+' : outgoing ? '−' : '';
    const tone = incoming ? 'jade' : outgoing ? 'gold' : 'muted';
    return `<div class="row"><div class="ic-box ${tone}">${incoming ? ui.icons.arrowDown : outgoing ? ui.icons.arrowUp : ui.icons.history}</div><div class="body"><div class="t">${type}</div><div class="s">${date} ${status}</div></div><div class="end"><div class="amt">${sign}${money(rawAmount)}</div></div></div>`;
  }).join('')}</div>`;
}

function productAvailable(product) {
  const hasCapacity = product.category !== 'Limited' || !(Number(product.max_capacity) > 0) || Number(product.current_sold || 0) < Number(product.max_capacity);
  return product.is_active === true && product.is_coming_soon !== true && hasCapacity;
}

function productCards(products) {
  const featured = products.filter(productAvailable).slice(0,3);
  if (!featured.length) return showEmpty('There are no currently available products to feature.');
  return `<div class="dashboard-products">${featured.map((product) => `
    <a href="products.html" class="card card-pad dashboard-product" style="display:block;text-decoration:none;">
      <div class="flex between center" style="gap:10px"><div class="name" style="font-weight:650;font-size:16px;">${escapeHTML(product.name || 'Product')}</div>${ui.icons.chevron}</div>
      <div class="small muted" style="margin-top:5px">${escapeHTML(product.category || 'Uncategorized')}</div>
      <div class="grid-2" style="margin-top:14px">
        <div><div class="small muted">Price</div><div style="font-weight:600">${money(product.price)}</div></div>
        <div><div class="small muted">Profit amount</div><div style="font-weight:600;color:var(--jade-light)">${money(product.profit)}</div></div>
      </div>
      <div class="small muted" style="margin-top:12px">${escapeHTML(product.duration_days ?? '—')} days · ${escapeHTML(product.payout_type || 'Payout details unavailable')}</div>
    </a>`).join('')}</div>`;
}

function render({profileData, balanceData, investmentData, historyData, productData}) {
  const balance = Number(balanceData?.balance || 0);
  const investments = Array.isArray(investmentData?.investments) ? investmentData.investments : [];
  const transactions = Array.isArray(historyData?.transactions) ? historyData.transactions : [];
  const products = Array.isArray(productData?.products) ? productData.products : [];
  const activeInvestments = investments.filter((item) => String(item.status || '').toLowerCase() === 'active');
  const investedAmount = activeInvestments.reduce((sum, item) => sum + Number(item.amount || 0), 0);
  const user = profileData?.profile || profileData?.user || {};
  const fullName = user.full_name || user.name || user.display_name || '';
  const firstName = String(fullName).trim().split(/\s+/)[0];
  const greeting = firstName ? `Welcome back, ${escapeHTML(firstName)}` : 'Welcome back';
  app.innerHTML = `
    ${ui.topbarHTML('home', balance)}
    <main class="page page-enter">
      <div class="flex between center dashboard-intro" style="gap:12px;flex-wrap:wrap"><div><div class="small muted">Your account overview</div><h1 style="font-family:var(--f-display);font-size:clamp(22px,4vw,30px);margin:4px 0 0">${greeting}</h1></div><div class="badge jade">Live account</div></div>
      <section class="welcome-support" aria-label="Welcome and support links">
        <div class="welcome-support-copy"><div class="badge jade">Welcome to LCG</div><h2>We’re here to help you get started</h2><p>Join the LCG community on Telegram or contact support on WhatsApp whenever you need assistance.</p></div>
        <div class="support-links"><a class="btn btn-jade" href="https://wa.me/2347031622805" target="_blank" rel="noopener noreferrer">${ui.icons.phone} WhatsApp support</a><a class="btn btn-ghost" href="https://t.me/+nP6kJIXYw7A2NGFk" target="_blank" rel="noopener noreferrer">${ui.icons.share} Join Telegram</a></div>
      </section>
      <section class="hero-balance dashboard-balance" aria-label="Wallet balance">
        <div class="label"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:var(--jade-light);box-shadow:0 0 8px var(--jade-light)"></span> Current balance</div>
        <div class="amount">${money(balance)}</div>
        <div class="sub-row"><div class="sub"><div class="k">Active investments</div><div class="v">${activeInvestments.length}</div></div><div class="sub"><div class="k">Amount invested</div><div class="v">${money(investedAmount, true)}</div></div><div class="sub"><div class="k">Products available</div><div class="v">${products.filter(productAvailable).length}</div></div></div>
      </section>
      <div class="dashboard-actions" style="margin:14px 0 20px"><a href="deposit.html" class="btn btn-jade">${ui.icons.deposit} Deposit</a><a href="withdraw.html" class="btn btn-ghost">${ui.icons.withdraw} Withdraw</a></div>
      <div class="dashboard-grid">
        <div class="dashboard-stack">
          <section class="dashboard-section"><div class="section-head"><h2>Active investments</h2><a href="investments.html" class="link">View all →</a></div>
            ${activeInvestments.length ? `<div style="display:flex;flex-direction:column;gap:10px">${activeInvestments.slice(0,4).map((item)=>`<a href="investments.html" class="card card-pad" style="display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none"><span style="min-width:0"><span style="display:block;font-weight:600;overflow-wrap:anywhere">${escapeHTML(item.products?.name || 'Investment')}</span><span class="small muted">${money(item.amount)} · ${escapeHTML(item.status || '')}</span></span><span class="small muted" style="text-align:right;white-space:nowrap">${escapeHTML(formatDate(item.end_date))}<br>End date</span></a>`).join('')}</div>` : showEmpty('You have no active investments yet.')}
          </section>
          <section class="dashboard-section"><div class="section-head"><h2>Recent transactions</h2><a href="wallet.html" class="link">Wallet →</a></div><div class="card card-pad">${transactionRows(transactions)}</div></section>
        </div>
        <section class="dashboard-section"><div class="section-head"><h2>Featured products</h2><a href="products.html" class="link">View catalog →</a></div>${productCards(products)}</section>
      </div>
      <div class="foot-mini"><div class="logo-row">${ui.icons.shield}${ui.icons.lock}</div>LCG · Account information from your live account</div>
    </main>
    ${ui.bottomNavHTML('home')}`;
  app.setAttribute('aria-busy', 'false');
}

async function load() {
  app.dataset.liveReady = 'false';
  app.setAttribute('aria-busy', 'true');
  showLoading(app, 'Loading your live account…');
  try {
    const [profileData, balanceData, investmentData, historyData, productData] = await Promise.all([
      getProfile(),
      apiRequest('/api/wallet?action=getBalance'),
      apiRequest('/api/investments?action=getInvestments'),
      apiRequest('/api/wallet?action=getHistory'),
      apiRequest('/api/products?action=getProducts')
    ]);
    render({profileData, balanceData, investmentData, historyData, productData});
    app.dataset.liveReady = 'true';
  } catch (error) {
    showPageError(app, error, load);
    app.setAttribute('aria-busy', 'false');
    app.dataset.liveReady = 'true';
  }
}
load();
</script>
</body>
</html>
