<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Investment Products</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
const cats = [
  { key: 'all', label: 'All' },
  { key: 'general', label: 'General' },
  { key: 'welfare', label: 'Welfare' },
  { key: 'limited', label: 'Limited' },
];
app.innerHTML = `
${topbarHTML('plans')}
<main class="page page-enter">
  <div class="page-head">
    <h1>Investment products</h1>
    <p>Curated plans across general, welfare, and limited series.</p>
  </div>

  <div class="tabs" data-tabs="plans">
    ${cats.map((c,i)=>`<button class="tab ${i===0?'active':''}" data-cat="${c.key}">${c.label}</button>`).join('')}
  </div>

  <div data-tab-panel="plans" style="display:flex;flex-direction:column;gap:14px;">
    ${LCG.plans.map(p => `
      <div class="plan ${p.accent} ${p.sold?'sold':''} lux" data-cat="${p.cat}">
        <div class="top">
          <div>
            <div class="name">${p.name}</div>
            <div class="cat">${p.cat} · ${p.days}-day cycle</div>
          </div>
          ${p.badge?`<span class="tag ${p.accent}">${p.badge}</span>`:`${p.sold?'<span class="tag muted">Sold out</span>':''}`}
        </div>
        <div class="stats">
          <div class="s"><div class="k">Daily rate</div><div class="v ${p.accent}">${p.daily}%</div></div>
          <div class="s"><div class="k">Duration</div><div class="v">${p.days}d</div></div>
          <div class="s"><div class="k">Total return</div><div class="v ${p.accent}">${p.total}%</div></div>
        </div>
        <div class="perks">
          ${p.perks.map(pk=>`<li${p.sold?' class="off"':''}>${pk}</li>`).join('')}
        </div>
        <div class="flex between center" style="margin-top:14px;">
          <div class="small muted">${naira(p.min)} – ${nairaShort(p.max)}</div>
          ${p.sold
            ? `<button class="btn btn-ghost btn-sm" onclick="toast('Added to waitlist','info');">Join waitlist</button>`
            : `<button class="btn btn-jade btn-sm" onclick="toast('Opening ${p.name}…','ok');setTimeout(()=>location.href='investments.html',500);">Invest now</button>`}
        </div>
      </div>
    `).join('')}
  </div>

  <div class="card card-pad" style="background:rgba(231,200,115,0.05);border-color:rgba(231,200,115,0.18);">
    <div class="flex gap-3 center">
      <div class="ic-box gold" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;">${I.shield}</div>
      <div>
        <div style="font-weight:600;font-size:14px;">Capital protection</div>
        <div class="small muted" style="margin-top:2px;">Plans above ₦200,000 are covered by the LCG Investor Protection Fund.</div>
      </div>
    </div>
  </div>
</main>
${bottomNavHTML('plans')}
`;
</script>
</body>
</html>
