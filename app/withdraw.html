<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCG - Withdraw</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="page-content" style="padding: var(--spacing-md);">
    <h2 style="margin-bottom: var(--spacing-lg);">Request Withdrawal</h2>

    <div class="card fade-in">
      <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-sm);">
        <span style="color: var(--text-muted);">Available Balance</span>
        <span style="font-family: 'Sora'; font-weight: 700; color: var(--primary);" id="balance-display">₦0.00</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
        <span style="color: var(--text-muted);">Withdrawal Fee</span>
        <span style="font-weight: 600;" id="fee-display">0%</span>
      </div>
    </div>

    <form id="withdraw-form" class="card fade-in">
      <div class="form-group">
        <label class="form-label">Amount (₦)</label>
        <input type="number" id="amount" class="input" placeholder="Min. 1000" required min="1000">
      </div>
      <div class="form-group">
        <label class="form-label">Bank Name</label>
        <input type="text" id="bank_name" class="input" placeholder="e.g. GTBank" required>
      </div>
      <div class="form-group">
        <label class="form-label">Account Number</label>
        <input type="text" id="account_number" class="input" placeholder="10 digits" required maxlength="10">
      </div>
      <div class="form-group">
        <label class="form-label">Account Name</label>
        <input type="text" id="account_name" class="input" placeholder="Name on account" required>
      </div>
      
      <div style="background: var(--bg); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); display: flex; justify-content: space-between;">
        <span style="font-weight: 600;">You will receive:</span>
        <span style="font-family: 'Sora'; font-weight: 800; color: var(--gold);" id="net-amount">₦0.00</span>
      </div>

      <button type="submit" class="btn btn-gold btn-block btn-lg" id="submit-btn">
        <i class="fa-solid fa-bolt"></i> Request Withdrawal
      </button>
    </form>
  </div>

  <script type="module">
    import { requireAuth } from '/assets/js/auth-guard.js';
    import { loadShell } from '/assets/js/components.js';
    import { supabase, formatCurrency } from '/assets/js/lcg-client.js';

    const user = await requireAuth();
    if (!user) return;
    await loadShell();

    // Load balance and fee
    const balRes = await fetch('/api/wallet?action=getBalance', {
      headers: { 'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}` }
    });
    const { balance } = await balRes.json();
    document.getElementById('balance-display').textContent = formatCurrency(balance);

    const { data: settings } = await supabase.from('site_settings').select('key, value');
    const feePct = Number(settings?.find(s => s.key === 'withdrawal_fee_percentage')?.value || 0);
    document.getElementById('fee-display').textContent = `${feePct}%`;

    // Calculate net amount on input
    document.getElementById('amount').addEventListener('input', (e) => {
      const amount = Number(e.target.value) || 0;
      const fee = (amount * feePct) / 100;
      document.getElementById('net-amount').textContent = formatCurrency(amount - fee);
    });

    // Handle submit
    document.getElementById('withdraw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';

      const res = await fetch('/api/wallet?action=requestWithdrawal', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}` 
        },
        body: JSON.stringify({
          amount: document.getElementById('amount').value,
          bank_name: document.getElementById('bank_name').value,
          account_number: document.getElementById('account_number').value,
          account_name: document.getElementById('account_name').value
        })
      });

      const data = await res.json();
      if (!res.ok) {
        alert(data.error);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Request Withdrawal';
      } else {
        alert('Withdrawal requested successfully! Your balance has been deducted pending approval.');
        window.location.href = '/app/wallet.html';
      }
    });
  </script>
</body>
</html>
