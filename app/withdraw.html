<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060907">
<title>LCG — Withdraw</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.withdraw-page { max-width:680px; margin-inline:auto; }
.withdraw-page .field + .field { margin-top:16px; }
.withdraw-page .hero-balance { padding:22px; }
.withdraw-summary { display:grid; gap:8px; margin-top:16px; }
.withdraw-summary .summary-row { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding-top:8px; border-top:1px solid var(--border); }
.withdraw-summary .summary-row span:last-child { text-align:right; overflow-wrap:anywhere; }
@media(max-width:520px) {
 .withdraw-page { padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
 .withdraw-page .hero-balance { padding:20px 16px; }
 .withdraw-page .hero-balance .amount { font-size:clamp(28px,8vw,36px); overflow-wrap:anywhere; }
 .withdraw-page .btn-block { white-space:normal; line-height:1.25; padding-inline:14px; }
}
</style>
</head>
<body>
<div class="app" id="app" data-live-ready="false" aria-live="polite"></div>
<script src="../assets/js/app.js"></script>
<script type="module">
import { apiRequest, money, escapeHTML, showPageError, showLoading } from '../assets/js/live-data.js';
import { AFRSTAR_BANKS } from '../assets/js/afrstar-banks.js';

const app = document.getElementById('app');
const UI = window.LCGUI;
const safeNumber = value => { const n = Number(value); return Number.isFinite(n) ? n : null; };

function render(balance, afrstarEnabled) {
  const bankField = afrstarEnabled
    ? `<div class="field"><label for="bank-code">Bank and AfrStar bank code</label><select class="input" id="bank-code" required><option value="">Select your bank</option>${AFRSTAR_BANKS.map(bank => `<option value="${bank.code}" data-bank-name="${escapeHTML(bank.name)}">${escapeHTML(bank.name)} (${bank.code})</option>`).join('')}</select><span class="small muted">Bank codes are from the supplied AfrStar Nigeria API v2 directory.</span></div>`
    : '<div class="field"><label for="bank-name">Bank name</label><input class="input" id="bank-name" type="text" maxlength="120" autocomplete="organization" placeholder="Enter bank name" required></div>';

  app.innerHTML = `${UI.topbarHTML('me', balance)}<main class="page page-enter withdraw-page">
    <div class="page-head"><h1>Withdraw</h1><p>Submit a payout request to the bank account entered below. Payouts are processed after review; AfrStar-enabled payouts complete after a verified callback.</p></div>
    <section class="hero-balance" aria-label="Available balance"><div class="label">Available wallet balance</div><div class="amount">${escapeHTML(money(balance))}</div></section>
    <div class="field" style="margin-top:18px"><label for="withdraw-amount">Withdrawal amount</label><div class="input-wrap"><span class="lead" aria-hidden="true" style="color:var(--jade-light);font-weight:600">₦</span><input class="input has-lead" id="withdraw-amount" type="number" inputmode="decimal" min="0.01" step="0.01" max="${escapeHTML(balance)}" placeholder="0.00" autocomplete="off" required></div><span class="small muted">Enter a positive amount up to your current available balance. Fees and limits are not estimated here.</span></div>
    ${bankField}
    <div class="field"><label for="account-number">Account number</label><input class="input" id="account-number" type="text" inputmode="numeric" maxlength="40" autocomplete="off" placeholder="Enter account number" required></div>
    <div class="field"><label for="account-name">Account name</label><input class="input" id="account-name" type="text" maxlength="120" autocomplete="name" placeholder="Enter account holder name" required></div>
    <div id="withdraw-result" aria-live="polite"></div>
    <button class="btn btn-gold btn-block" id="submit-withdrawal" type="button">${UI.icons.withdraw} Submit withdrawal request</button>
    <p class="small muted" style="text-align:center;line-height:1.6;margin-top:12px">Submitting a request deducts the requested amount immediately. Failed AfrStar payouts are refunded only after a verified failure callback.</p>
  </main>${UI.bottomNavHTML('me')}`;

  const amountInput = document.getElementById('withdraw-amount');
  const result = document.getElementById('withdraw-result');
  const submit = document.getElementById('submit-withdrawal');
  submit.addEventListener('click', async () => {
    const amount = safeNumber(amountInput.value);
    const bankSelect = afrstarEnabled ? document.getElementById('bank-code') : null;
    const bankName = afrstarEnabled
      ? bankSelect?.selectedOptions?.[0]?.dataset.bankName || ''
      : document.getElementById('bank-name').value.trim();
    const bankCode = afrstarEnabled ? bankSelect?.value || '' : '';
    const accountNumber = document.getElementById('account-number').value.trim();
    const accountName = document.getElementById('account-name').value.trim();
    if (amount === null || amount <= 0 || amount > balance || !bankName || !accountNumber || !accountName || (afrstarEnabled && !/^800\d{5}$/.test(bankCode))) {
      const message = amount !== null && amount > balance
        ? 'Amount exceeds your available balance.'
        : afrstarEnabled && !bankCode
          ? 'Select a bank from the AfrStar directory.'
          : 'Enter a valid amount and complete all bank account details.';
      UI.toast(message, 'err');
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Submitting request…';
    result.innerHTML = '';
    try {
      const response = await apiRequest('/api/wallet?action=requestWithdrawal', {
        method: 'POST',
        body: { amount, bank_name: bankName, bank_code: afrstarEnabled ? bankCode : null, account_number: accountNumber, account_name: accountName }
      });
      const fee = safeNumber(response?.fee ?? response?.fee_amount);
      const net = safeNumber(response?.net ?? response?.net_amount ?? response?.amount_received);
      const requestId = response?.withdrawal?.id ?? response?.id ?? response?.request_id ?? response?.reference;
      const returnedBalance = safeNumber(response?.balance);
      let effectiveBalance = returnedBalance;
      let balanceNote = '';
      if (effectiveBalance === null) {
        try {
          const balanceResult = await apiRequest('/api/wallet?action=getBalance');
          effectiveBalance = safeNumber(balanceResult?.balance);
        } catch (_) { /* The withdrawal request itself has already succeeded. */ }
      }
      if (effectiveBalance !== null) balanceNote = `<div class="summary-row"><span class="small muted">Updated available balance</span><span class="tnum">${escapeHTML(money(effectiveBalance))}</span></div>`;
      const responseDetails = `${fee !== null ? `<div class="summary-row"><span class="small muted">Server-returned fee</span><span class="tnum">${escapeHTML(money(fee))}</span></div>` : ''}${net !== null ? `<div class="summary-row"><span class="small muted">Server-returned net amount</span><span class="tnum">${escapeHTML(money(net))}</span></div>` : ''}${requestId ? `<div class="summary-row"><span class="small muted">Request reference</span><span>${escapeHTML(requestId)}</span></div>` : ''}${balanceNote}`;
      result.innerHTML = `<div class="card card-pad" style="margin-top:16px" role="status"><strong>Withdrawal request submitted</strong><p class="small muted" style="margin:6px 0 0">The requested amount has been deducted from your balance. ${afrstarEnabled ? 'An administrator must approve it; the payout is not final until AfrStar confirms it by callback.' : 'Processing remains subject to review.'}</p>${responseDetails ? `<div class="withdraw-summary">${responseDetails}</div>` : ''}</div>`;
      UI.toast('Withdrawal request submitted.','ok');
      if (effectiveBalance !== null) {
        const amountNode = app.querySelector('.hero-balance .amount');
        if (amountNode) amountNode.textContent = money(effectiveBalance);
      }
      amountInput.value = '';
    } catch (error) {
      result.innerHTML = `<div class="data-state data-state-error" role="alert"><p>${escapeHTML(error?.message || 'Could not submit the withdrawal request.')}</p></div>`;
      UI.toast(error?.message || 'Could not submit withdrawal request.','err');
    } finally {
      submit.disabled = false;
      submit.innerHTML = `${UI.icons.withdraw} Submit withdrawal request`;
    }
  });
  app.dataset.liveReady = 'true';
}

async function load() {
  app.dataset.liveReady = 'false';
  showLoading(app, 'Loading your account…');
  try {
    const response = await apiRequest('/api/wallet?action=getBalance');
    const balance = safeNumber(response?.balance);
    if (balance === null) throw new Error('The wallet service returned an invalid balance.');
    let afrstarEnabled = false;
    try {
      const config = await apiRequest('/api/wallet?action=getPaymentConfig');
      afrstarEnabled = config?.afrstar_enabled === true;
    } catch (_) {
      // The non-gateway withdrawal flow remains available if the feature flag is unavailable.
    }
    render(balance, afrstarEnabled);
  } catch (error) {
    showPageError(app, error, load);
    app.dataset.liveReady = 'true';
  }
}

load();
</script>
</body>
</html>
