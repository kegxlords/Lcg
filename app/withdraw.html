<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Withdraw</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
const tier = LCG.tiers.find(t=>t.current);
const fee = tier.fee;
const limit = tier.dailyLimit;
app.innerHTML = `
${topbarHTML('me')}
<main class="page page-enter">
  <div class="page-head">
    <h1>Withdraw</h1>
    <p>Funds arrive within 30 minutes during business hours.</p>
  </div>

  <div class="hero-balance" style="padding:20px;">
    <div class="label">Available to withdraw</div>
    <div class="amount" style="font-size:34px;"><span class="cur">₦</span>${LCG.user.available.toLocaleString()}</div>
    <div class="sub-row">
      <div class="sub"><div class="k">VIP fee</div><div class="v">${fee}%</div></div>
      <div class="sub"><div class="k">Daily limit</div><div class="v">${nairaShort(limit)}</div></div>
      <div class="sub"><div class="k">Earnings</div><div class="v" style="color:var(--jade-light);">${naira(LCG.user.earnings)}</div></div>
    </div>
  </div>

  <div class="field">
    <label for="amount">Withdrawal amount</label>
    <div class="input-wrap">
      <span class="lead" style="color:var(--jade-light);font-weight:600;left:16px;">₦</span>
      <input class="input has-lead" id="amount" type="number" placeholder="0" min="1000" oninput="updatePreview()">
      <button class="trail" onclick="document.getElementById('amount').value=${LCG.user.available};updatePreview();" style="background:rgba(52,211,153,0.1);color:var(--jade-light);">MAX</button>
    </div>
  </div>

  <div class="amt-chips">
    ${[1000,5000,10000,25000].map(c=>`<button class="amt-chip" onclick="document.getElementById('amount').value=${c};updatePreview();">₦${c/1000}K</button>`).join('')}
  </div>

  <div class="section-head"><h2>Payout account</h2><a href="#" class="link" onclick="toast('Add new account','info');return false;">+ Add</a></div>
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div class="method on" onclick="this.parentElement.querySelectorAll('.method').forEach(m=>m.classList.remove('on'));this.classList.add('on');">
      <div class="ic-box gold" style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;">GT</div>
      <div class="body"><div class="t">GTBank</div><div class="s">•••• 2841 · Adaeze O.</div></div>
      <div class="check on"></div>
    </div>
    <div class="method" onclick="this.parentElement.querySelectorAll('.method').forEach(m=>m.classList.remove('on'));this.classList.add('on');">
      <div class="ic-box jade" style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;">AC</div>
      <div class="body"><div class="t">Access Bank</div><div class="s">•••• 7190 · Adaeze O.</div></div>
      <div class="check"></div>
    </div>
  </div>

  <div class="card card-pad">
    <div class="flex between center" style="padding:4px 0;">
      <span class="small muted">Amount</span>
      <span id="pvAmount" class="tnum" style="font-weight:600;">₦0.00</span>
    </div>
    <div class="flex between center" style="padding:10px 0;border-bottom:1px solid var(--border);">
      <span class="small muted">Withdrawal fee (${fee}%)</span>
      <span id="pvFee" class="tnum small">−₦0.00</span>
    </div>
    <div class="flex between center" style="padding-top:10px;">
      <span style="font-weight:600;">You receive</span>
      <span id="pvReceive" class="tnum" style="font-family:var(--f-display);font-weight:700;color:var(--jade-light);font-size:18px;">₦0.00</span>
    </div>
  </div>

  <button class="btn btn-gold btn-block" onclick="confirmWithdraw()">${I.withdraw} Withdraw funds</button>
  <p class="small muted" style="text-align:center;line-height:1.6;">Withdrawals process within 30 min (WAT 8am–10pm). Off-hours process next morning. VIP Gold tier receives priority.</p>
</main>
${bottomNavHTML('me')}
`;

function updatePreview(){
  const amt = parseFloat(document.getElementById('amount').value)||0;
  const f = amt * fee / 100;
  document.getElementById('pvAmount').textContent = naira(amt);
  document.getElementById('pvFee').textContent = '−' + naira(f);
  document.getElementById('pvReceive').textContent = naira(amt - f);
}
function confirmWithdraw(){
  const amt = parseFloat(document.getElementById('amount').value)||0;
  if(amt < 1000){ toast('Minimum withdrawal is ₦1,000','err'); return; }
  if(amt > LCG.user.available){ toast('Amount exceeds available balance','err'); return; }
  if(amt > limit){ toast('Exceeds daily VIP limit of '+nairaShort(limit),'err'); return; }
  toast('Withdrawal of '+naira(amt)+' submitted','info');
  setTimeout(()=>toast('Funds arriving within 30 minutes','ok'), 1400);
}
</script>
</body>
</html>
