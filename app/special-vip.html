<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — VIP Program</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
const cur = LCG.tiers.find(t=>t.current);
const next = LCG.tiers.find(t=>t.level===cur.level+1);
app.innerHTML = `
${topbarHTML('me')}
<main class="page page-enter">
  <div class="page-head">
    <h1>VIP program</h1>
    <p>Unlock lower fees, higher limits, and exclusive perks.</p>
  </div>

  <!-- current tier -->
  <div class="vip-card ${cur.color} current">
    <div class="flex between center">
      <div>
        <div class="level">Current tier</div>
        <div class="name shimmer">${cur.name}</div>
      </div>
      <div style="font-size:42px;line-height:1;">${cur.level===1?'🥈':cur.level===2?'👑':cur.level===3?'💎':'◆'}</div>
    </div>
    <div class="grid-2" style="margin-top:16px;">
      <div class="stat" style="padding:12px;background:rgba(255,255,255,0.05);"><div class="k">Daily limit</div><div class="v" style="font-size:16px;">${nairaShort(cur.dailyLimit)}</div></div>
      <div class="stat" style="padding:12px;background:rgba(255,255,255,0.05);"><div class="k">Withdrawal fee</div><div class="v" style="font-size:16px;color:var(--jade-light);">${cur.fee}%</div></div>
    </div>
  </div>

  ${next ? `
  <div class="card card-pad lux">
    <div class="flex between center">
      <div>
        <div class="small muted">Next: ${next.name}</div>
        <div style="font-weight:600;font-size:15px;margin-top:2px;">${next.req}</div>
      </div>
      <div style="font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--gold-light);">${Math.round(LCG.user.teamSize/next.team*100)}%</div>
    </div>
    <div class="progress gold" style="margin-top:12px;"><i style="width:${Math.round(LCG.user.teamSize/next.team*100)}%;"></i></div>
    <div class="flex between center small muted" style="margin-top:6px;">
      <span>Team ${LCG.user.teamSize}/${next.team}</span>
      <span>${LCG.user.invested>=1000000?'✓':nairaShort(next.req.includes('₦')?1000000:0)}</span>
    </div>
  </div>` : ''}

  <!-- all tiers -->
  <div class="section-head"><h2>All tiers</h2></div>
  <div style="display:flex;flex-direction:column;gap:14px;">
    ${LCG.tiers.map(t => `
      <div class="vip-card ${t.color} ${t.current?'current':''}">
        <div class="flex between center">
          <div>
            <div class="level">Tier ${t.level}</div>
            <div class="name">${t.name}</div>
          </div>
          <div class="avatar ${t.color==='silver'?'silver':'gold'}" style="width:44px;height:44px;font-size:16px;">${t.level===1?'S':t.level===2?'G':t.level===3?'P':'D'}</div>
        </div>
        <div class="flex between center" style="margin-top:14px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
          <div class="small"><span class="muted">Fee</span> <b style="color:var(--jade-light);">${t.fee}%</b></div>
          <div class="small"><span class="muted">Limit</span> <b>${nairaShort(t.dailyLimit)}</b></div>
          <div class="small"><span class="muted">Team</span> <b>${t.team}+</b></div>
        </div>
        <ul class="perks">
          ${t.perks.map(p=>`<li>${p}</li>`).join('')}
        </ul>
        ${t.current
          ? `<div class="badge jade" style="margin-top:14px;">CURRENT</div>`
          : `<button class="btn btn-ghost btn-sm btn-block" style="margin-top:14px;" onclick="toast('Reach the requirements to unlock','info');">Requirements</button>`}
      </div>
    `).join('')}
  </div>

  <div class="card card-pad" style="background:rgba(231,200,115,0.06);border-color:rgba(231,200,115,0.2);">
    <div class="flex gap-3 center">
      <div class="ic-box gold" style="width:42px;height:42px;">${I.sparkle}</div>
      <div>
        <div style="font-weight:600;font-size:14px;">VIP cashback</div>
        <div class="small muted" style="margin-top:2px;">Earn up to 3% weekly cashback on all payouts. Credited every Monday.</div>
      </div>
    </div>
  </div>
</main>
${bottomNavHTML('me')}
`;
</script>
</body>
</html>
