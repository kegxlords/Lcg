<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Lucky Wheel</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
const seg = 360 / LCG.wheelPrizes.length;
const tones = { jade: '#10b981', gold: '#e7c873', violet: '#a78bfa', muted: '#3a423d' };
let wheelHTML = '';
LCG.wheelPrizes.forEach((p, i) => {
  const a0 = i * seg - 90;
  const a1 = (i + 1) * seg - 90;
  const color = tones[p.tone];
  const cx = 50, cy = 50, r = 50;
  const x0 = cx + r * Math.cos(a0 * Math.PI / 180);
  const y0 = cy + r * Math.sin(a0 * Math.PI / 180);
  const x1 = cx + r * Math.cos(a1 * Math.PI / 180);
  const y1 = cy + r * Math.sin(a1 * Math.PI / 180);
  wheelHTML += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 0,1 ${x1},${y1} Z" fill="${color}" fill-opacity="0.85" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>`;
  const mid = (a0 + a1) / 2;
  const tx = cx + (r * 0.65) * Math.cos(mid * Math.PI / 180);
  const ty = cy + (r * 0.65) * Math.sin(mid * Math.PI / 180);
  wheelHTML += `<text x="${tx}" y="${ty}" fill="#04120c" font-size="6" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid+90} ${tx} ${ty})">${p.label}</text>`;
});
app.innerHTML = `
${topbarHTML('home')}
<main class="page page-enter" style="align-items:center;">
  <div class="page-head" style="text-align:center;width:100%;">
    <h1>Lucky wheel</h1>
    <p style="margin:0 auto;max-width:280px;">One free spin daily. Win cash, bonuses, or VIP perks.</p>
  </div>

  <div class="card card-pad" style="background:linear-gradient(160deg,rgba(167,139,250,0.1),rgba(16,185,129,0.05));width:100%;text-align:center;">
    <div class="flex between center" style="margin-bottom:4px;">
      <div class="badge violet">Daily free</div>
      <div class="small muted">${I.clock} Resets in 14h 32m</div>
    </div>
  </div>

  <div class="wheel-wrap">
    <div class="wheel-pointer"></div>
    <div class="wheel" data-wheel>
      <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;border-radius:50%;">
        ${wheelHTML}
      </svg>
    </div>
    <div class="wheel-hub" onclick="spinWheel()">SPIN</div>
  </div>

  <button class="btn btn-jade btn-block" onclick="spinWheel()">${I.wheel} Spin the wheel</button>

  <div class="section-head" style="width:100%;"><h2>Prize pool</h2></div>
  <div class="grid-2" style="width:100%;">
    ${LCG.wheelPrizes.map(p => `
      <div class="stat" style="padding:12px;">
        <div class="k" style="color:${tones[p.tone]};">${p.tone==='muted'?'—':''}${p.label}</div>
      </div>
    `).join('')}
  </div>

  <div class="card card-pad" style="width:100%;">
    <div style="font-weight:600;font-size:14px;margin-bottom:10px;">How it works</div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:8px;">
      <li class="flex gap-3"><span class="badge jade" style="flex-shrink:0;">1</span><span class="small" style="color:var(--fg-soft);">Each account gets one free spin every 24 hours.</span></li>
      <li class="flex gap-3"><span class="badge jade" style="flex-shrink:0;">2</span><span class="small" style="color:var(--fg-soft);">Cash prizes are credited instantly to your earnings balance.</span></li>
      <li class="flex gap-3"><span class="badge jade" style="flex-shrink:0;">3</span><span class="small" style="color:var(--fg-soft);">Bonus prizes (VIP boosts, extra spins) apply automatically.</span></li>
      <li class="flex gap-3"><span class="badge jade" style="flex-shrink:0;">4</span><span class="small" style="color:var(--fg-soft);">Players on a 7-day streak get a guaranteed minimum ₦100 prize.</span></li>
    </ul>
  </div>
</main>
${bottomNavHTML('home')}
`;
</script>
</body>
</html>
