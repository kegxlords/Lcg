<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCG - Lucky Wheel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/wheel.css">
</head>
<body>
  <div class="page-content" style="padding: var(--spacing-md); text-align: center;">
    <h2>Lucky Wheel</h2>
    <p style="color: var(--text-muted); margin-bottom: var(--spacing-lg);">Spin to win instant cash prizes!</p>

    <div class="card fade-in" style="display: inline-block; width: 100%; max-width: 400px;">
      <div style="margin-bottom: var(--spacing-md);">
        <span style="font-size: 0.9rem; color: var(--text-muted);">Available Spins: </span>
        <strong id="spin-count" style="font-family: 'Sora'; color: var(--gold); font-size: 1.2rem;">0</strong>
      </div>

      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel">
          <!-- Segments generated by JS -->
        </div>
      </div>

      <button id="spin-btn" class="btn btn-gold btn-block btn-lg" onclick="doSpin()">
        <i class="fa-solid fa-dharmachakra"></i> SPIN NOW
      </button>
    </div>

    <div class="card fade-in" style="margin-top: var(--spacing-lg); text-align: left;">
      <h3 style="margin-bottom: var(--spacing-md);">Spin History</h3>
      <div id="spin-history">
        <div style="text-align: center; color: var(--text-muted);"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/assets/js/auth-guard.js';
    import { loadShell, updateBalance } from '/assets/js/components.js';
    import { supabase, formatCurrency } from '/assets/js/lcg-client.js';

    const user = await requireAuth();
    if (!user) return;
    await loadShell();

    const prizes = [600, 1000, 2000, 4000, 6000, 8000];
    let currentRotation = 0;
    let isSpinning = false;

    // Initialize Wheel Visuals
    const wheelEl = document.getElementById('wheel');
    prizes.forEach((prize, index) => {
      const segment = document.createElement('div');
      segment.className = 'wheel-segment';
      segment.style.transform = `rotate(${index * 60 + 30}deg)`; // Center text in 60deg slice
      segment.innerHTML = `<span>₦${prize}</span>`;
      wheelEl.appendChild(segment);
    });

    async function loadData() {
      const token = (await supabase.auth.getSession()).data.session.access_token;
      
      const infoRes = await fetch('/api/referrals?action=getReferralInfo', { headers: { 'Authorization': `Bearer ${token}` } });
      const info = await infoRes.json();
      document.getElementById('spin-count').textContent = info.available_spins;

      const histRes = await fetch('/api/wheel?action=getHistory', { headers: { 'Authorization': `Bearer ${token}` } });
      const { history } = await histRes.json();
      
      const list = document.getElementById('spin-history');
      if (history.length === 0) {
        list.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 10px;">No spins yet.</div>';
      } else {
        list.innerHTML = history.map(h => `
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);">
            <span style="font-size: 0.9rem;">${new Date(h.created_at).toLocaleDateString()}</span>
            <strong style="color: var(--gold);">+${formatCurrency(h.amount_won)}</strong>
          </div>
        `).join('');
      }
    }

    window.doSpin = async () => {
      if (isSpinning) return;
      const spinCount = parseInt(document.getElementById('spin-count').textContent);
      if (spinCount <= 0) return alert('No available spins!');

      isSpinning = true;
      const btn = document.getElementById('spin-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Spinning...';

      const token = (await supabase.auth.getSession()).data.session.access_token;
      
      // 1. Ask backend for the prize (It's rigged to the admin's fixed amount)
      const res = await fetch('/api/wheel?action=spin', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error);
        isSpinning = false;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-dharmachakra"></i> SPIN NOW';
        return;
      }

      // 2. Calculate rotation to land on the prize
      const prize = data.prize;
      const prizeIndex = prizes.indexOf(prize);
      const segmentAngle = 360 / prizes.length; // 60 degrees
      
      // The pointer is at the top (0 degrees). 
      // To land on index 0 (600), we need to rotate so that segment is at the top.
      // Segment 0 is drawn at 30deg. To bring it to 0deg (top), we rotate -30deg (or 330deg).
      const targetAngle = 360 - (prizeIndex * segmentAngle + 30); 
      
      // Add multiple full rotations (e.g., 5 spins = 1800deg) for effect
      const extraSpins = 360 * 5; 
      currentRotation += extraSpins + targetAngle - (currentRotation % 360);

      // 3. Animate
      wheelEl.style.transform = `rotate(${currentRotation}deg)`;

      // 4. Show result after animation (4s matches CSS transition)
      setTimeout(() => {
        alert(`🎉 Congratulations! You won ${formatCurrency(prize)}!`);
        document.getElementById('spin-count').textContent = parseInt(document.getElementById('spin-count').textContent) - 1;
        updateBalance(data.new_balance);
        loadData(); // Refresh history
        
        isSpinning = false;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-dharmachakra"></i> SPIN NOW';
      }, 4000);
    };

    loadData();
  </script>
</body>
</html>
