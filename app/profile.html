<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Profile</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="../assets/js/app.js"></script>
<script>
const app = document.getElementById('app');
const u = LCG.user;
app.innerHTML = `
${topbarHTML('me')}
<main class="page page-enter">
  <div class="profile-head">
    <div class="avatar gold">${u.avatar}</div>
    <div class="name">${u.name}</div>
    <div class="uid">${u.uid} · ${I.copy}</div>
    <div class="vip-pill">
      <span class="badge gold">${I.vip} ${u.vip.name} · Level ${u.vip.level}</span>
    </div>
    <div class="small muted" style="margin-top:6px;">Member since ${u.joined}</div>
  </div>

  <!-- lifetime stats -->
  <div class="card card-pad">
    <div style="font-weight:600;font-size:13px;color:var(--fg-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px;">Lifetime</div>
    <div class="grid-2">
      <div>
        <div class="small muted">Total earned</div>
        <div style="font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--jade-light);margin-top:2px;">${naira(u.totalEarned)}</div>
      </div>
      <div>
        <div class="small muted">Total invested</div>
        <div style="font-family:var(--f-display);font-size:18px;font-weight:700;margin-top:2px;">${nairaShort(u.invested)}</div>
      </div>
      <div>
        <div class="small muted">Team size</div>
        <div style="font-family:var(--f-display);font-size:18px;font-weight:700;margin-top:2px;">${u.teamSize}</div>
      </div>
      <div>
        <div class="small muted">Check-in streak</div>
        <div style="font-family:var(--f-display);font-size:18px;font-weight:700;margin-top:2px;color:var(--gold-light);">${u.checkinStreak} days 🔥</div>
      </div>
    </div>
  </div>

  <!-- referral mini -->
  <div class="card card-pad lux" style="background:linear-gradient(160deg,rgba(231,200,115,0.08),rgba(255,255,255,0.02));">
    <div class="flex between center">
      <div>
        <div class="small muted">Your referral code</div>
        <div style="font-family:var(--f-display);font-size:18px;font-weight:700;margin-top:2px;">${u.referralCode}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="copyText('${u.referralCode}','Code')">${I.share} Share</button>
    </div>
  </div>

  <!-- account section -->
  <div class="section-head"><h2>Account</h2></div>
  <div class="card" style="overflow:hidden;">
    <a href="#" class="set-row" onclick="toast('Edit profile','info');return false;">
      <div class="ic-box">${I.user}</div>
      <div class="body">Personal info<div class="s">${u.email}</div></div>
      <div class="chev">${I.chevron}</div>
    </a>
    <a href="#" class="set-row" onclick="toast('Phone settings','info');return false;">
      <div class="ic-box">${I.phone}</div>
      <div class="body">Phone number<div class="s">${u.phone}</div></div>
      <div class="chev">${I.chevron}</div>
    </a>
    <a href="#" class="set-row" onclick="toast('Bank accounts','info');return false;">
      <div class="ic-box">${I.bank}</div>
      <div class="body">Bank accounts<div class="s">2 linked</div></div>
      <div class="chev">${I.chevron}</div>
    </a>
    <a href="#" class="set-row" onclick="toast('KYC verified','ok');return false;">
      <div class="ic-box jade">${I.shield}</div>
      <div class="body">Identity verification<div class="s" style="color:var(--jade-light);">✓ Verified</div></div>
      <div class="chev">${I.chevron}</div>
    </a>
  </div>

  <!-- preferences -->
  <div class="section-head"><h2>Preferences</h2></div>
  <div class="card" style="overflow:hidden;">
    <a href="#" class="set-row" onclick="toggleNotif(this);return false;">
      <div class="ic-box">${I.bell}</div>
      <div class="body">Notifications</div>
      <div class="chev" style="display:flex;align-items:center;gap:8px;"><span class="small muted">On</span>${I.chevron}</div>
    </a>
    <a href="special-vip.html" class="set-row">
      <div class="ic-box gold">${I.vip}</div>
      <div class="body">VIP program</div>
      <div class="chev">${I.chevron}</div>
    </a>
    <a href="#" class="set-row" onclick="toast('Language: English','info');return false;">
      <div class="ic-box">${I.info}</div>
      <div class="body">Language</div>
      <div class="chev" style="display:flex;align-items:center;gap:8px;"><span class="small muted">English</span>${I.chevron}</div>
    </a>
    <a href="#" class="set-row" onclick="toast('Appearance: Dark','info');return false;">
      <div class="ic-box">${I.moon}</div>
      <div class="body">Appearance</div>
      <div class="chev" style="display:flex;align-items:center;gap:8px;"><span class="small muted">Dark</span>${I.chevron}</div>
    </a>
  </div>

  <!-- about -->
  <div class="section-head"><h2>About</h2></div>
  <div class="card" style="overflow:hidden;">
    <a href="support.html" class="set-row">
      <div class="ic-box">${I.help}</div>
      <div class="body">Help & support</div>
      <div class="chev">${I.chevron}</div>
    </a>
    <a href="#" class="set-row" onclick="toast('Terms of Service','info');return false;">
      <div class="ic-box">${I.info}</div>
      <div class="body">Terms of service</div>
      <div class="chev">${I.chevron}</div>
    </a>
    <a href="#" class="set-row" onclick="toast('Privacy policy','info');return false;">
      <div class="ic-box">${I.shield}</div>
      <div class="body">Privacy policy</div>
      <div class="chev">${I.chevron}</div>
    </a>
    <div class="set-row">
      <div class="ic-box">${I.info}</div>
      <div class="body">App version</div>
      <div class="chev"><span class="small muted">2.4.0</span></div>
    </div>
  </div>

  <a href="../index.html" class="btn btn-ghost btn-block" style="color:#fb7185;">${I.logout} Sign out</a>

  <div class="foot-mini">
    © 2026 LCG Wealth Platform · Licensed<br>
    All investments carry risk. Only invest what you can afford to lose.
  </div>
</main>
${bottomNavHTML('me')}
`;

function toggleNotif(el){
  const s = el.querySelector('.small.muted');
  if(s.textContent==='On'){ s.textContent='Off'; s.style.color='var(--fg-muted)'; toast('Notifications off','info'); }
  else { s.textContent='On'; s.style.color=''; toast('Notifications on','ok'); }
}
</script>
</body>
</html>
