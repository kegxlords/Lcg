<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060907">
<title>LCG — Profile</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.profile-hero{text-align:center;padding:23px 18px;background:radial-gradient(90% 100% at 50% 0,rgba(16,185,129,.12),transparent 65%),linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.02))}.profile-hero .avatar{width:66px;height:66px;font-size:25px;margin:0 auto 12px}.profile-name{font:700 clamp(21px,5vw,28px)/1.2 var(--f-display);overflow-wrap:anywhere}.profile-contact{font-size:13px;color:var(--fg-muted);overflow-wrap:anywhere;margin-top:5px}.profile-tier{display:inline-flex;align-items:center;gap:6px;margin-top:12px}.profile-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.profile-stat{min-width:0;padding:15px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.03)}.profile-stat .k{font-size:11px;color:var(--fg-muted)}.profile-stat .v{font:700 clamp(16px,4.5vw,22px)/1.25 var(--f-display);margin-top:5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.account-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}.account-row:last-child{border-bottom:0;padding-bottom:0}.account-row:first-child{padding-top:0}.account-row .body{min-width:0;flex:1}.account-row .title{font-size:13px;color:var(--fg-muted)}.account-row .value{font-size:14px;font-weight:500;overflow-wrap:anywhere;margin-top:2px}.signout{color:#fb7185}
@media(min-width:700px){.app{max-width:760px}.profile-stats{gap:14px}.profile-stat{padding:19px}.profile-stat .v{font-size:24px}}
</style>
</head>
<body>
<div class="app" id="app" data-live-ready="false"></div>
<script src="../assets/js/app.js"></script>
<script type="module">
import { apiRequest, getProfile, money, escapeHTML, formatDate, showPageError, showLoading, signOut } from '../assets/js/live-data.js';
const app = document.getElementById('app');
const ui = window.LCGUI;
app.dataset.liveReady = 'false';
app.innerHTML = `${ui.topbarHTML('me', 0)}<main class="page page-enter" id="pageContent" aria-live="polite"></main>${ui.bottomNavHTML('me')}`;
const content = document.getElementById('pageContent');
const amount = (value) => money(Number(value) || 0);
function setTopbarBalance(balance) {
  document.querySelector('.topbar')?.remove();
  app.insertAdjacentHTML('afterbegin', ui.topbarHTML('me', Number(balance) || 0));
}
function render(data, balanceData, investmentData) {
  const user = data?.user || {};
  const profile = data?.profile || {};
  const investments = Array.isArray(investmentData?.investments) ? investmentData.investments : [];
  const name = String(profile.full_name || 'Account holder');
  const email = String(user.email || profile.email || '');
  const phone = String(user.phone || '');
  const code = String(profile.referral_code || '');
  const invested = investments.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
  const totalDeposits = Number(profile.total_personal_deposit) || 0;
  const joined = formatDate(profile.created_at);
  content.innerHTML = `
    <header class="page-head"><h1>Profile</h1><p>Your account details and live activity.</p></header>
    <section class="card profile-hero"><div class="avatar gold" aria-hidden="true">${escapeHTML(name.trim().charAt(0).toUpperCase() || 'A')}</div><h2 class="profile-name">${escapeHTML(name)}</h2>${email?`<div class="profile-contact">${escapeHTML(email)}</div>`:''}<div class="small muted" style="margin-top:9px">Member since ${escapeHTML(joined)}</div></section>
    <section class="profile-stats" aria-label="Account activity"><div class="profile-stat"><div class="k">Wallet balance</div><div class="v" style="color:var(--jade-light)">${amount(balanceData?.balance)}</div></div><div class="profile-stat"><div class="k">Total personal deposits</div><div class="v">${amount(totalDeposits)}</div></div><div class="profile-stat"><div class="k">Investment capital</div><div class="v">${amount(invested)}</div></div><div class="profile-stat"><div class="k">Investments</div><div class="v">${investments.length.toLocaleString('en-NG')}</div></div></section>
    <section class="card card-pad"><div class="section-head" style="padding:0 0 14px"><h2>Account details</h2></div><div class="account-row"><div class="ic-box">${ui.icons.mail}</div><div class="body"><div class="title">Email</div><div class="value">${email?escapeHTML(email):'Not provided'}</div></div></div><div class="account-row"><div class="ic-box">${ui.icons.phone}</div><div class="body"><div class="title">Phone number</div><div class="value">${phone?escapeHTML(phone):'Not provided'}</div></div></div>${code?`<div class="account-row"><div class="ic-box gold">${ui.icons.gift}</div><div class="body"><div class="title">Your referral code</div><div class="value" style="font-family:var(--f-display);font-weight:600;letter-spacing:.03em">${escapeHTML(code)}</div></div><button class="btn btn-ghost btn-sm" type="button" data-copy-code aria-label="Copy referral code">${ui.icons.copy}</button></div>`:''}</section>
    <section class="card card-pad"><div class="section-head" style="padding:0 0 12px"><h2>Quick links</h2></div><a href="wallet.html" class="set-row"><div class="ic-box gold">${ui.icons.wallet}</div><div class="body">Wallet<div class="s">View balance and transaction history</div></div><div class="chev">${ui.icons.chevron}</div></a><a href="deposit.html" class="set-row"><div class="ic-box">${ui.icons.deposit}</div><div class="body">Make a deposit<div class="s">Fund your wallet</div></div><div class="chev">${ui.icons.chevron}</div></a><a href="withdraw.html" class="set-row"><div class="ic-box">${ui.icons.withdraw}</div><div class="body">Withdraw funds<div class="s">Request a withdrawal</div></div><div class="chev">${ui.icons.chevron}</div></a><a href="investments.html" class="set-row"><div class="ic-box">${ui.icons.chart}</div><div class="body">My investments<div class="s">Track active and completed investments</div></div><div class="chev">${ui.icons.chevron}</div></a><a href="leaderboard.html" class="set-row"><div class="ic-box gold">${ui.icons.trophy}</div><div class="body">Leaderboard<div class="s">See top team deposit rankings</div></div><div class="chev">${ui.icons.chevron}</div></a></section>
    <section class="card card-pad"><div class="section-head" style="padding:0 0 12px"><h2>More</h2></div><a href="special-vip.html" class="set-row"><div class="ic-box gold">${ui.icons.vip}</div><div class="body">VIP program<div class="s">View membership benefits</div></div><div class="chev">${ui.icons.chevron}</div></a><a href="support.html" class="set-row"><div class="ic-box">${ui.icons.help}</div><div class="body">Help &amp; support</div><div class="chev">${ui.icons.chevron}</div></a></section>
    <button class="btn btn-ghost btn-block signout" type="button" data-sign-out>${ui.icons.logout} Sign out</button>
    <div class="foot-mini">© 2026 LCG Wealth Platform<br>All investments carry risk. Only invest what you can afford to lose.</div>`;
  content.querySelector('[data-copy-code]')?.addEventListener('click', () => ui.copyText(code, 'Referral code'));
  content.querySelector('[data-sign-out]')?.addEventListener('click', async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    try { await signOut(); }
    catch (error) { button.disabled = false; ui.toast(error?.message || 'Could not sign out.', 'err'); }
  });
  app.dataset.liveReady = 'true';
}
async function load() {
  app.dataset.liveReady = 'false';
  showLoading(content, 'Loading your profile…');
  try {
    const [profileData, balanceData, investmentData] = await Promise.all([
      getProfile(),
      apiRequest('/api/wallet?action=getBalance'),
      apiRequest('/api/investments?action=getInvestments')
    ]);
    setTopbarBalance(balanceData.balance);
    render(profileData, balanceData, investmentData);
  } catch (error) {
    showPageError(content, error, load);
    app.dataset.liveReady = 'true';
  }
}
load();
</script>
</body>
</html>
