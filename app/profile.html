<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCG - My Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .profile-hero {
      background: linear-gradient(135deg, var(--primary-dim), var(--gold-dim));
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: var(--spacing-xl);
      text-align: center;
      margin-bottom: var(--spacing-lg);
      position: relative;
      overflow: hidden;
    }
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: grid;
      place-items: center;
      margin: 0 auto var(--spacing-md);
      font-family: 'Sora';
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--bg);
      box-shadow: 0 0 30px rgba(0, 224, 138, 0.3);
      border: 3px solid var(--bg);
    }
    .profile-name {
      font-family: 'Sora';
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: var(--spacing-xs);
    }
    .profile-email {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: var(--spacing-md);
    }
    .profile-join-date {
      display: inline-block;
      background: var(--surface);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
      text-align: center;
    }
    .stat-icon {
      font-size: 1.5rem;
      margin-bottom: var(--spacing-xs);
    }
    .stat-value {
      font-family: 'Sora';
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    
    .menu-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }
    .menu-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: var(--spacing-md);
      font-weight: 700;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { padding-left: 10px; }
    .menu-item-left {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    .menu-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }
    .menu-icon.green { background: var(--primary-dim); color: var(--primary); }
    .menu-icon.gold { background: var(--gold-dim); color: var(--gold); }
    .menu-icon.blue { background: rgba(42, 171, 238, 0.15); color: #2AABEE; }
    .menu-icon.red { background: rgba(255, 90, 90, 0.15); color: var(--danger); }
    .menu-text { font-weight: 600; font-size: 0.95rem; }
    .menu-subtext { font-size: 0.75rem; color: var(--text-muted); }
    
    .ref-code-box {
      background: var(--bg);
      border: 1px dashed var(--gold);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }
    .ref-code-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .ref-code-value {
      font-family: 'Sora';
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 3px;
    }
    
    .logout-btn {
      width: 100%;
      padding: var(--spacing-md);
      background: rgba(255, 90, 90, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: var(--radius-lg);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
    }
    .logout-btn:hover {
      background: var(--danger);
      color: white;
    }
  </style>
</head>
<body>
  <div class="page-content" style="padding: var(--spacing-md);">
    <!-- Profile Hero -->
    <div class="profile-hero fade-in">
      <div class="profile-avatar" id="avatar-initial">?</div>
      <div class="profile-name" id="profile-name">Loading...</div>
      <div class="profile-email" id="profile-email">—</div>
      <div class="profile-join-date"><i class="fa-regular fa-calendar"></i> Joined <span id="join-date">—</span></div>
    </div>

    <!-- Referral Code -->
    <div class="ref-code-box fade-in">
      <div class="ref-code-label">YOUR REFERRAL CODE</div>
      <div class="ref-code-value" id="ref-code">—</div>
      <button class="btn btn-gold btn-sm" style="margin-top: 10px;" onclick="copyRefCode()">
        <i class="fa-regular fa-copy"></i> Copy Code
      </button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid fade-in">
      <div class="stat-card">
        <div class="stat-icon" style="color: var(--primary);"><i class="fa-solid fa-wallet"></i></div>
        <div class="stat-value" style="color: var(--primary);" id="stat-balance">₦0</div>
        <div class="stat-label">Balance</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="color: var(--gold);"><i class="fa-solid fa-coins"></i></div>
        <div class="stat-value" style="color: var(--gold);" id="stat-earned">₦0</div>
        <div class="stat-label">Total Earned</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="color: #2AABEE;"><i class="fa-solid fa-users"></i></div>
        <div class="stat-value" id="stat-team">0</div>
        <div class="stat-label">Team Size</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="color: var(--danger);"><i class="fa-solid fa-fire"></i></div>
        <div class="stat-value" id="stat-streak">0</div>
        <div class="stat-label">Day Streak</div>
      </div>
    </div>

    <!-- Account Menu -->
    <div class="menu-section fade-in">
      <div class="menu-title">Account</div>
      <a href="/app/wallet.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon green"><i class="fa-solid fa-wallet"></i></div>
          <div>
            <div class="menu-text">Wallet</div>
            <div class="menu-subtext">Transactions & history</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
      </a>
      <a href="/app/investments.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon gold"><i class="fa-solid fa-chart-line"></i></div>
          <div>
            <div class="menu-text">My Investments</div>
            <div class="menu-subtext">Active & completed plans</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
      </a>
      <a href="/app/special-vip.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon gold"><i class="fa-solid fa-crown"></i></div>
          <div>
            <div class="menu-text">Special VIPs</div>
            <div class="menu-subtext">Referral rewards & salaries</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
      </a>
    </div>

    <!-- Support Menu -->
    <div class="menu-section fade-in">
      <div class="menu-title">Support</div>
      <a href="/app/support.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon blue"><i class="fa-solid fa-headset"></i></div>
          <div>
            <div class="menu-text">Customer Service</div>
            <div class="menu-subtext">Chat with our team</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
      </a>
      <a href="/app/leaderboard.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon gold"><i class="fa-solid fa-trophy"></i></div>
          <div>
            <div class="menu-text">Leaderboard</div>
            <div class="menu-subtext">Top 10 influencers</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
      </a>
    </div>

    <!-- Logout -->
    <button class="logout-btn fade-in" onclick="doLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> Log Out
    </button>
  </div>

  <script type="module">
    import { requireAuth } from '/assets/js/auth-guard.js';
    import { loadShell, updateBalance } from '/assets/js/components.js';
    import { supabase, formatCurrency } from '/assets/js/lcg-client.js';

    const user = await requireAuth();
    if (!user) return;
    await loadShell();

    async function loadProfile() {
      // Fetch profile + wallet + stats in parallel
      const [{ data: profile }, { data: wallet }, { data: transactions }, { count: teamCount }] = await Promise.all([
        supabase.from('profiles').select('*').eq('id', user.id).single(),
        supabase.from('wallets').select('balance').eq('user_id', user.id).single(),
        supabase.from('transactions').select('amount').eq('user_id', user.id).eq('status', 'approved').in('type', ['investment_return', 'referral_commission', 'wheel_win', 'special_vip_salary']),
        supabase.from('profiles').select('id', { count: 'exact', head: true }).eq('upline_id', user.id)
      ]);

      // Update header balance
      if (wallet) updateBalance(wallet.balance);

      // Profile info
      const fullName = profile?.full_name || user.email?.split('@')[0] || 'User';
      document.getElementById('profile-name').textContent = fullName;
      document.getElementById('profile-email').textContent = user.email;
      document.getElementById('avatar-initial').textContent = fullName.charAt(0).toUpperCase();
      document.getElementById('join-date').textContent = new Date(profile?.created_at || Date.now()).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
      document.getElementById('ref-code').textContent = profile?.referral_code || 'N/A';
      document.getElementById('stat-balance').textContent = formatCurrency(wallet?.balance || 0);
      document.getElementById('stat-team').textContent = teamCount || 0;
      document.getElementById('stat-streak').textContent = profile?.current_streak || 0;

      const totalEarned = transactions?.reduce((sum, t) => sum + Number(t.amount), 0) || 0;
      document.getElementById('stat-earned').textContent = formatCurrency(totalEarned);
    }

    window.copyRefCode = () => {
      const code = document.getElementById('ref-code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert('Referral code copied!');
      }).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('Referral code copied!');
      });
    };

    window.doLogout = async () => {
      if (!confirm('Are you sure you want to log out?')) return;
      await supabase.auth.signOut();
      window.location.href = '/index.html';
    };

    loadProfile();
  </script>
</body>
</html>
