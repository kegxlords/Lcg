<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Reset Password</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <a href="index.html" style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-muted);width:fit-content;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to sign in
  </a>

  <div class="auth-brand" style="margin-top:40px;">
    <div class="logo" style="background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));box-shadow:var(--sh-glow-gold),inset 0 2px 0 rgba(255,255,255,0.4);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#241a04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Reset password</h1>
    <p>Enter your email and we'll send a reset link</p>
  </div>

  <form class="auth-form" id="resetForm" onsubmit="event.preventDefault();sendReset();">
    <div class="field">
      <label for="email">Email address</label>
      <div class="input-wrap">
        <input class="input" id="email" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <button type="submit" class="btn btn-jade btn-block">Send reset link</button>

    <p id="resetMsg" class="small" style="display:none;text-align:center;color:var(--jade-light);background:rgba(16,185,129,0.08);padding:12px;border-radius:var(--r-md);border:1px solid rgba(52,211,153,0.22);">
      ✅ Reset link sent. Check your inbox within 5 minutes.
    </p>
  </form>

  <div class="auth-foot" style="margin-top:auto;">
    Remembered it? <a href="index.html">Sign in</a>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script>
function sendReset() {
  document.getElementById('resetMsg').style.display = 'block';
  toast('Reset link sent to ' + document.getElementById('email').value, 'ok');
}
</script>
</body>
</html>
