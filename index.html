<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060907">
<title>LCG — Sign In</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div style="display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;">
    <span class="logo-dot" style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--jade-light),var(--jade-deep));display:grid;place-items:center;color:#04120c;font-size:16px;box-shadow:var(--sh-glow-jade),inset 0 1px 0 rgba(255,255,255,0.3);">L</span>
    <span>LCG</span>
    <span class="badge jade" style="margin-left:auto;font-size:10px;">SECURE</span>
  </div>

  <div class="auth-brand" style="margin-top:48px;">
    <div class="logo">L</div>
    <h1>Welcome back</h1>
    <p>Sign in to continue building wealth</p>
  </div>

  <form class="auth-form" id="loginForm">
    <div class="field">
      <label for="email">Email address</label>
      <div class="input-wrap">
        <input class="input" id="email" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="field">
      <label for="pw">Password</label>
      <div class="input-wrap">
        <input class="input has-trail" id="pw" type="password" placeholder="Enter your password" required>
        <button type="button" class="trail" data-pw-toggle="pw" id="eyeBtn" aria-label="Show password"></button>
      </div>
    </div>

    <div class="flex between center" style="font-size:13px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg-soft);" onclick="document.getElementById('rem').classList.toggle('on')">
        <span class="check on" id="rem"></span>
        <span>Remember me</span>
      </label>
      <a href="forgot.html" style="color:var(--jade-light);font-weight:600;">Forgot password?</a>
    </div>

    <button type="submit" class="btn btn-jade btn-block">Sign in</button>

    <div class="divider">or continue with</div>

    <div class="grid-2">
      <button type="button" class="btn btn-ghost btn-sm" onclick="toast('Google sign-in','info');">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1h-9.18v2.92h5.27c-.23 1.5-1.65 4.4-5.27 4.4-3.17 0-5.76-2.62-5.76-5.86s2.59-5.86 5.76-5.86c1.8 0 3.01.77 3.7 1.43l2.52-2.43C16.96 3.85 14.79 2.9 12.17 2.9 7.34 2.9 3.42 6.82 3.42 11.65s3.92 8.75 8.75 8.75c5.05 0 8.39-3.55 8.39-8.54 0-.57-.06-1.01-.21-1.76z"/></svg>
        Google
      </button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="toast('Apple sign-in','info');">
        <svg width="14" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.66c-.03-2.17 1.78-3.21 1.86-3.27-1.01-1.48-2.59-1.69-3.15-1.71-1.34-.14-2.62.79-3.3.79-.69 0-1.74-.77-2.87-.75-1.48.02-2.84.86-3.6 2.18-1.53 2.66-.39 6.6 1.11 8.76.74 1.06 1.62 2.25 2.77 2.21 1.11-.05 1.53-.72 2.87-.72 1.34 0 1.71.72 2.88.7 1.19-.02 1.95-1.08 2.68-2.15.84-1.23 1.19-2.42 1.21-2.48-.03-.01-2.32-.89-2.35-3.52zM14.83 5.62c.61-.74 1.02-1.76.91-2.78-.88.04-1.94.59-2.57 1.32-.56.65-1.05 1.69-.92 2.69.98.08 1.98-.5 2.58-1.23z"/></svg>
        Apple
      </button>
    </div>
  </form>

  <div class="auth-foot">
    Don't have an account? <a href="register.html">Create account</a>
  </div>

  <p class="small muted" style="text-align:center;margin-top:18px;line-height:1.6;">
    By signing in you agree to our <a href="#" style="color:var(--fg-soft);text-decoration:underline;">Terms</a> and <a href="#" style="color:var(--fg-soft);text-decoration:underline;">Privacy Policy</a>.
    Investments are subject to risk. Capital protection applies per plan.
  </p>
</div>

<script src="./assets/js/app.js"></script>
<script>
document.getElementById('eyeBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
</script>
<script type="module" src="./assets/js/auth-page.js"></script>
</body>
</html>
